    return `<?xml version="1.0" encoding="UTF-8"?>\n` +
      `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="${f(b.x)} ${f(b.y)} ${f(b.w)} ${f(b.h)}" width="${f(b.w)}" height="${f(b.h)}" fill="none" stroke-linecap="round" stroke-linejoin="round">\n` +
      (defs ? `<defs>\n${defs}</defs>\n` : '') +
      under + body + (payload ? `<metadata id="whiteboard-board">${payload}</metadata>\n` : '') + '</svg>\n';
  };

  /* ---- PDF -----------------------------------------------------------
     Vector output. Eraser runs become luminosity soft masks applied to a
     transparency group holding everything drawn before them. */
  function pdfPath(s, outline) {
    let d = '', cx = 0, cy = 0;
    (outline ? WB.traceVar : WB.trace)(s, {
      moveTo(x, y) { d += `${f(x)} ${f(y)} m `; cx = x; cy = y; },
      lineTo(x, y) { d += `${f(x)} ${f(y)} l `; cx = x; cy = y; },
      quadraticCurveTo(a, b, x, y) {
        d += `${f(cx + (a - cx) * 2 / 3)} ${f(cy + (b - cy) * 2 / 3)} ${f(x + (a - x) * 2 / 3)} ${f(y + (b - y) * 2 / 3)} ${f(x)} ${f(y)} c `;
        cx = x; cy = y;
      },
      closePath() { d += 'h '; },
    });
    return d;
  }
  const rgb = (hex) => [1, 3, 5].map((i) => f(parseInt(hex.slice(i, i + 2), 16) / 255)).join(' ');
  const enc = new TextEncoder();

  async function deflate(bytes) {
    if (typeof CompressionStream === 'undefined') return null;
    try {
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    } catch (e) { return null; }
  }

  /* pages: a sheet board's pages, each exported as its own PDF page at its true paper size
     (board units are CSS pixels, 96 per inch; PDF units are points, 72 per inch). Without pages
     the whole drawing (b) becomes one page, one unit per point as before. */
  WB.toPDF = async function (strokes, b, bg, payload, pages, pattern) {
    strokes = flatten(strokes, true);
    const sheet = pages && pages.length ? pages : null;
    const pageList = sheet || [b];
    const k = sheet ? 0.75 : Math.min(1, 14400 / b.w, 14400 / b.h); // PDF pages max out at 14400 units
    const bbox = `[${f(b.x)} ${f(b.y)} ${f(b.x + b.w)} ${f(b.y + b.h)}]`;
    const rect = `${f(b.x)} ${f(b.y)} ${f(b.w)} ${f(b.h)} re`;

    const objs = [null, null]; // 1 catalog, 2 page tree (filled in at the end)
    const add = (body) => (objs.push(body), objs.length);
    const alphaObj = new Map();
    const newStream = () => ({ ops: '1 J 1 j\n', gs: new Map(), xo: new Map() });
    function alpha(st, o) {
      const name = 'A' + Math.round(o * 1000);
      if (!alphaObj.has(name)) alphaObj.set(name, add(`<< /Type /ExtGState /CA ${f(o)} /ca ${f(o)} >>`));
      st.gs.set(name, alphaObj.get(name));
      return name;
    }
    const resources = (st) => {
      const dict = (m) => [...m].map(([n, id]) => `/${n} ${id} 0 R`).join(' ');
      return `<< /ExtGState << ${dict(st.gs)} >> /XObject << ${dict(st.xo)} >> >>`;
    };
    async function streamObj(dict, text) {
      const raw = typeof text === 'string' ? enc.encode(text) : text, z = await deflate(raw), data = z || raw;
      const head = enc.encode(`<< ${dict} /Length ${data.length}${z ? ' /Filter /FlateDecode' : ''} >>\nstream\n`);
      const tail = enc.encode('\nendstream');
      const out = new Uint8Array(head.length + data.length + tail.length);
      out.set(head); out.set(data, head.length); out.set(tail, head.length + data.length);
      return add(out);
    }
    /* A PDF page's picture: a JPEG goes in as it is; anything else as raw pixels. */
    /* A PDF page's picture: a JPEG goes in as it is, its size read from its header, so nothing is
       decoded; it is tagged /WhiteboardPage n so Import can take it back out (see extractBoard).
       Anything else is decoded, for this page only, and goes in as raw pixels. */
    async function pageImage(p, index) {
      if (p.src.startsWith('data:image/jpeg;base64,')) {
        const data = fromB64(p.src.slice(23)), size = jpegSize(data);
        if (size) {
          const dims = `/Width ${size.w} /Height ${size.h} /BitsPerComponent 8 /ColorSpace /DeviceRGB`;
          const head = enc.encode(`<< /Type /XObject /Subtype /Image ${dims} /Filter /DCTDecode /WhiteboardPage ${index} /Length ${data.length} >>\nstream\n`), tail = enc.encode('\nendstream');
          const out = new Uint8Array(head.length + data.length + tail.length);
          out.set(head); out.set(data, head.length); out.set(tail, head.length + data.length);
          return add(out);
        }
      }
      const { img, done } = await borrow(p);
      if (!img.naturalWidth) { done(); return 0; }
      const dims = `/Width ${img.naturalWidth} /Height ${img.naturalHeight} /BitsPerComponent 8 /ColorSpace /DeviceRGB`;
      const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0); done();
      const px = g.getImageData(0, 0, cv.width, cv.height).data, n = cv.width * cv.height, rgbBytes = new Uint8Array(n * 3);
      for (let i = 0; i < n; i++) { rgbBytes[3 * i] = px[4 * i]; rgbBytes[3 * i + 1] = px[4 * i + 1]; rgbBytes[3 * i + 2] = px[4 * i + 2]; }
      return streamObj(`/Type /XObject /Subtype /Image ${dims}`, rgbBytes);
    }
    const formObj = (st, cs) => streamObj(
      `/Type /XObject /Subtype /Form /BBox ${bbox} /Group << /S /Transparency /CS /${cs} /I true >> /Resources ${resources(st)}`, st.ops);

    let cur = newStream(), has = false, n = 0, tn = 0;
    for (const run of runs(strokes)) {
      if (run.kind === 'ink') {
        for (const s of run.items) {
          if (s.tool === 'image') {
            // The picture's pixels, at most 4000 px on the long side, with its transparency as a soft mask.
            const { img, done } = await borrow(s);
            if (!img.naturalWidth) { done(); continue; }
            const q = Math.min(1, 4000 / Math.max(img.naturalWidth, img.naturalHeight));
            const cv = document.createElement('canvas');
            cv.width = Math.max(1, Math.round(img.naturalWidth * q)); cv.height = Math.max(1, Math.round(img.naturalHeight * q));
            const g = cv.getContext('2d');
            g.drawImage(img, 0, 0, cv.width, cv.height);
            done();
            const px = g.getImageData(0, 0, cv.width, cv.height).data, n = cv.width * cv.height;
            const rgbBytes = new Uint8Array(n * 3), a = new Uint8Array(n);
            let clear = false;
            for (let i = 0; i < n; i++) {
              rgbBytes[3 * i] = px[4 * i]; rgbBytes[3 * i + 1] = px[4 * i + 1]; rgbBytes[3 * i + 2] = px[4 * i + 2];
              a[i] = px[4 * i + 3]; if (a[i] < 255) clear = true;
            }
            const dims = `/Width ${cv.width} /Height ${cv.height} /BitsPerComponent 8`;
            const maskId = clear ? await streamObj(`/Type /XObject /Subtype /Image ${dims} /ColorSpace /DeviceGray`, a) : 0;
            const imgId = await streamObj(`/Type /XObject /Subtype /Image ${dims} /ColorSpace /DeviceRGB${clear ? ` /SMask ${maskId} 0 R` : ''}`, rgbBytes);
            const name = 'I' + (++tn);
            cur.xo.set(name, imgId);
            // The image's unit square onto its turned box (PDF images run bottom-up).
            const co = Math.cos(s.rot || 0), si = Math.sin(s.rot || 0), cx = s.x + s.w / 2, cy = s.y + s.h / 2;
            const m = [co * s.w, si * s.w, si * s.h, -co * s.h, cx - (co * s.w + si * s.h) / 2, cy - (si * s.w - co * s.h) / 2];
            cur.ops += `q /${alpha(cur, s.opacity)} gs ${m.map(f).join(' ')} cm /${name} Do Q\n`;
          } else if (s.tool === 'text') {
            // Text goes in as a high-resolution alpha image in the text colour, so every font
            // and script looks exactly as it does on the board without embedding font files.
            const L = WB.textLayout(s), pad = s.size * 0.25, tw = L.w + 2 * pad, th = L.h + 2 * pad;
            const q = Math.min(96 / s.size, 4000 / tw, 4000 / th);
            const cv = document.createElement('canvas');
            cv.width = Math.max(1, Math.ceil(tw * q)); cv.height = Math.max(1, Math.ceil(th * q));
            const g = cv.getContext('2d');
            g.setTransform(q, 0, 0, q, (pad - s.x) * q, (pad - s.y) * q);
            WB.paint(g, { tool: 'text', x: s.x, y: s.y, text: s.text, font: s.font, size: s.size, color: '#000000', opacity: 1 });
            const px = g.getImageData(0, 0, cv.width, cv.height).data, a = new Uint8Array(cv.width * cv.height);
            for (let i = 0; i < a.length; i++) a[i] = px[i * 4 + 3];
            const maskId = await streamObj(`/Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceGray /BitsPerComponent 8`, a);
            const c = [1, 3, 5].map((i) => parseInt(s.color.slice(i, i + 2), 16));
            const imgId = await streamObj(`/Type /XObject /Subtype /Image /Width 1 /Height 1 /ColorSpace /DeviceRGB /BitsPerComponent 8 /SMask ${maskId} 0 R`, new Uint8Array(c));
            const name = 'T' + (++tn);
            cur.xo.set(name, imgId);
            // The text image's unit square onto its (possibly turned) box; the box turns about the text's anchor.
            const co = Math.cos(s.rot || 0), si = Math.sin(s.rot || 0);
            const bx = s.x - pad * co + pad * si, by = s.y - pad * si - pad * co;   // top-left corner of the padded box
            const tm = [co * tw, si * tw, si * th, -co * th, bx - si * th, by + co * th];
            cur.ops += `q /${alpha(cur, s.opacity)} gs ${tm.map(f).join(' ')} cm /${name} Do Q\n`;
          } else if (s.tool === 'fill') {
            const op = `/${alpha(cur, s.opacity)} gs ${rgb(s.color)} rg ${pdfPath(s)}f*\n`;
            cur.ops = s.under ? op + cur.ops : cur.ops + op;
          } else if (WB.hasPress(s)) cur.ops += `/${alpha(cur, s.opacity)} gs ${rgb(s.color)} rg ${pdfPath(s, true)}f\n`;
          else if (s.hl) cur.ops = `/${alpha(cur, s.opacity)} gs ${rgb(s.color)} RG ${f(s.width)} w 2 J [] 0 d ${pdfPath(s)}S 1 J\n` + cur.ops;   // beneath, like an "under" fill
          else cur.ops += `/${alpha(cur, s.opacity)} gs ${rgb(s.color)} RG ${f(s.width)} w [${(WB.dashOf(s) || []).map(f).join(' ')}] 0 d ${pdfPath(s)}S\n`;
        }
        has = true;
      } else if (has) {
        const mask = newStream();
        mask.ops += `1 g ${rect} f\n`;
        for (const s of run.items) mask.ops += `/${alpha(mask, s.opacity)} gs 0 G ${f(s.width)} w ${pdfPath(s)}S\n`;
        const maskId = await formObj(mask, 'DeviceGray');
        const smId = add(`<< /Type /ExtGState /SMask << /Type /Mask /S /Luminosity /G ${maskId} 0 R >> >>`);
        const groupId = await formObj(cur, 'DeviceRGB');
        n++;
        cur = newStream();
        cur.gs.set('M' + n, smId); cur.xo.set('X' + n, groupId);
        cur.ops += `q /M${n} gs /X${n} Do Q\n`;
      }
    }

    // Several pages share the drawing as one form, so it is stored once.
    let inkOps = cur.ops, inkRes = cur;
    if (pageList.length > 1) {
      const formId = await formObj(cur, 'DeviceRGB');
      inkRes = newStream(); inkRes.xo.set('Ink', formId);
      inkOps = '/Ink Do\n';
    }
    const kids = [];
    for (const [pi, p] of pageList.entries()) {
      const st = newStream();
      for (const [n2, id] of inkRes.gs) st.gs.set(n2, id);
      for (const [n2, id] of inkRes.xo) st.xo.set(n2, id);
      const pr = `${f(p.x)} ${f(p.y)} ${f(p.w)} ${f(p.h)} re`;
      let ops = `q ${f(k)} 0 0 ${f(-k)} ${f(-p.x * k)} ${f((p.y + p.h) * k)} cm\n` + (sheet ? `${pr} W n\n` : '') + (bg ? `${rgb(bg)} rg ${pr} f\n` : '');
      if (pattern) {
        // Dots are zero-length strokes with round caps; lines and the grid are hairlines of 1 unit.
        const xs = gridSteps(p.x, p.w), ys = gridSteps(p.y, p.h);
        let path = '';
        if (pattern.kind === 'dots') for (const y of ys) for (const x of xs) path += `${f(x)} ${f(y)} m ${f(x)} ${f(y)} l `;
        else {
          for (const y of ys) path += `${f(p.x)} ${f(y)} m ${f(p.x + p.w)} ${f(y)} l `;
          if (pattern.kind === 'lines') for (const x of xs) path += `${f(x)} ${f(p.y)} m ${f(x)} ${f(p.y + p.h)} l `;
        }
        if (path) ops += `q /${alpha(st, pattern.alpha)} gs ${rgb(pattern.color)} RG ${pattern.kind === 'dots' ? '2.4 w 1 J' : '1 w 0 J'} ${path}S Q\n`;
      }
      if (p.src) {
        const id = await pageImage(p, pi);
        if (id) { st.xo.set('P', id); ops += `q ${f(p.w)} 0 0 ${f(-p.h)} ${f(p.x)} ${f(p.y + p.h)} cm /P Do Q\n`; }
      }
      const contentId = await streamObj('', ops + inkOps + 'Q\n');
      kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(p.w * k)} ${f(p.h * k)}] /Contents ${contentId} 0 R ` +
        `/Group << /S /Transparency /CS /DeviceRGB >> /Resources ${resources(st)} >>`));
    }
    // The board itself, for Import: an uncompressed stream nothing refers to, so viewers ignore it.
    if (payload) add(`<< /Type /WhiteboardBoard /Length ${payload.length} >>\nstream\n${payload}\nendstream`);
    objs[0] = '<< /Type /Catalog /Pages 2 0 R >>';
    objs[1] = `<< /Type /Pages /Kids [${kids.map((id) => id + ' 0 R').join(' ')}] /Count ${kids.length} >>`;

    const parts = [], offsets = [];
    let pos = 0;
    const push = (x) => { const u = typeof x === 'string' ? enc.encode(x) : x; parts.push(u); pos += u.length; };
    push('%PDF-1.4\n'); push(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
    objs.forEach((body, i) => { offsets.push(pos); push(`${i + 1} 0 obj\n`); push(body); push('\nendobj\n'); });
    const xref = pos;
    push(`xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offsets.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
    push(`trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts, { type: 'application/pdf' });
  };

  /* ---- The board inside its exports ------------------------------------
     Every export carries the board it was made from, so Import can give back the editable
     board, not just a picture of it. The board travels as one ASCII run,
       WHTBD-DATA:<z|j>:<base64>:END     (z = deflate-compressed .whtbd, j = plain .whtbd)
     placed where each format's readers skip unknown data: a PNG text chunk, a WebP extra
     chunk, after the end of a JPEG or BMP, an SVG <metadata> element, an unused PDF stream.
     Reading is the same for every format: find that run anywhere in the file. */
  const toB64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const fromB64 = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
  async function inflate(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  WB.boardPayload = async function (text) {
    const raw = enc.encode(text), z = await deflate(raw);
    return z ? `WHTBD-DATA:z:${toB64(z)}:END` : `WHTBD-DATA:j:${toB64(raw)}:END`;
  };
  /* The .whtbd text carried inside an export, or null when the file carries none. */
  WB.extractBoard = async function (buffer, onPage) {
    const s = new TextDecoder('latin1').decode(buffer);
    const i = s.lastIndexOf('WHTBD-DATA:');
    if (i < 0) return null;
    const m = /^WHTBD-DATA:([zj]):([A-Za-z0-9+/=]+):END/.exec(s.slice(i));
    if (!m) return null;
    let text;
    try {
      const bytes = fromB64(m[2]);
      text = new TextDecoder().decode(m[1] === 'z' ? await inflate(bytes) : bytes);
    } catch (e) { return null; }
    // A PDF export doesn't repeat its page pictures inside the board (that would double its size):
    // the board says "whiteboard-pdf-page:n", and the picture is page n's own JPEG in the PDF.
    if (!text.includes(PDF_PAGE)) return text;
    try {
      const d = JSON.parse(text), u8 = new Uint8Array(buffer), missing = [];
      for (const p of d.pages || []) {
        if (typeof p.src !== 'string' || !p.src.startsWith(PDF_PAGE)) continue;
        const n = +p.src.slice(PDF_PAGE.length);
        const at = s.indexOf(`/WhiteboardPage ${n} `);
        const lm = at < 0 ? null : /^[^>]*\/Length (\d+) >>\nstream\n/.exec(s.slice(at, at + 200));
        if (!lm) { missing.push([p, n]); continue; }
        const start = at + lm[0].length;
        p.src = 'data:image/jpeg;base64,' + toB64(u8.subarray(start, start + +lm[1]));
      }
      // Another program re-saved the PDF (Acrobat's "Reduce file size", some iPad apps, a printer
      // driver): the board survived but its page pictures were recompressed or lost their tag.
      // Then page n is drawn from the PDF itself with pdf.js. That picture includes the ink drawn
      // on it, so the ink shows on top of its own copy; better than annotations on blank pages.
      if (missing.length) {
        let drawn = [];
        try { if (WB.readPdf) drawn = await WB.readPdf(buffer, onPage); } catch (e) { drawn = []; }
        for (const [p, n] of missing) { if (drawn[n]) p.src = drawn[n].src; else delete p.src; }
      }
      return JSON.stringify(d);
    } catch (e) { return text; }
  };
  const PDF_PAGE = 'whiteboard-pdf-page:';
  /* The board to put inside a PDF export: page JPEGs replaced by references to the PDF's own. */
  WB.pdfPayloadDoc = (doc) => ({ ...doc, pages: doc.pages.map((p, i) => (pdfReady(p) ? { ...p, src: PDF_PAGE + i } : p)) });
  /* toPDF copies a page's JPEG as it is (and tags it) only when it can read the JPEG's size from
     its header; otherwise the page goes in as raw pixels, untagged, and the hidden board must keep
     its picture. The header is near the start, so only the first part is decoded to check. */
  function pdfReady(p) {
    if (!p.src || !p.src.startsWith('data:image/jpeg;base64,')) return false;
    try { return !!jpegSize(fromB64(p.src.slice(23, 23 + 87380))); } catch (e) { return false; }
  }

  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = (u8) => { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
  const ascii = (u8, at, n) => String.fromCharCode(...u8.subarray(at, at + n));
  const join = (...parts) => { const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out; };

  /* Put the payload into an exported bitmap (png, jpeg, webp or bmp) of w × h pixels. */
  WB.embedPayload = async function (blob, payload, w, h) {
    const u8 = new Uint8Array(await blob.arrayBuffer()), data = enc.encode(payload);
    let out = null;
    if (u8[0] === 0x89 && ascii(u8, 1, 3) === 'PNG') {
      // A tEXt chunk ("WHTBD" keyword) just before the closing IEND chunk.
      const iend = u8.length - 12;
      if (ascii(u8, iend + 4, 4) === 'IEND') {
        const body = join(enc.encode('tEXtWHTBD\0'), data), chunk = new Uint8Array(body.length + 8), dv = new DataView(chunk.buffer);
        dv.setUint32(0, body.length - 4); chunk.set(body, 4); dv.setUint32(4 + body.length, crc32(body));
        out = join(u8.subarray(0, iend), chunk, u8.subarray(iend));
      }
    } else if (ascii(u8, 0, 4) === 'RIFF' && ascii(u8, 8, 4) === 'WEBP') {

      let rest = u8.subarray(12);
      const kind = ascii(u8, 12, 4);
      if (kind !== 'VP8X') {
        const x = new Uint8Array(18), dv = new DataView(x.buffer);

<script>
/* Flood fill. The board is rasterised, flooded from the drop point, and the
   flooded region is traced back into vector outlines so fills stay part of the
   vector document (and export to SVG/PDF like everything else). */
(function () {
  'use strict';
  const WB = (window.WB = window.WB || {});

  /* b = {x,y,w,h} world region to rasterise; (wx, wy) = world drop point.
     Returns { status: 'ok', rings, under } | { status: 'open' } | { status: 'outside' }.
     'open' means the flood reached the edge of the region: no closed shape contains the point. */
  WB.flood = function (strokes, b, scale, wx, wy) {
    // Pictures and highlighter strokes are backgrounds, not walls: a shape drawn over a photo still fills.
    // A dashed outline still encloses its shape: walls are drawn solid.
    // Lines thinner than 1.5 pixels at this resolution are drawn 1.5 pixels wide, so an outline
    // stays closed (and doesn't fade into a leaky dotted trail) however it was zoomed when drawn.
    const minW = 1.5 / scale;
    const walls = strokes.filter((s) => s.tool !== 'image' && s.tool !== 'plot' && !s.hl).map((s) => (s.dash || (s.points && s.width < minW) ? { ...s, dash: null, width: s.points ? Math.max(s.width, minW) : s.width, _opath: undefined } : s));
    const canvas = WB.renderToCanvas(walls, b, scale, null).canvas;
    const w = canvas.width, h = canvas.height, kx = w / b.w, ky = h / b.h;
    const sx = Math.floor((wx - b.x) * kx), sy = Math.floor((wy - b.y) * ky);
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return { status: 'outside' };
    const d = canvas.getContext('2d').getImageData(0, 0, w, h).data;

    // What counts as "the same area" as the drop point.
    const seed = (sy * w + sx) * 4, r0 = d[seed], g0 = d[seed + 1], b0 = d[seed + 2], a0 = d[seed + 3];
    const under = a0 < 16;               // dropped on empty canvas: the fill goes beneath the ink
    const TOL = 40;
    const match = under
      ? (i) => d[i * 4 + 3] < TOL
      : (i) => { const o = i * 4; return Math.abs(d[o] - r0) <= TOL && Math.abs(d[o + 1] - g0) <= TOL && Math.abs(d[o + 2] - b0) <= TOL && Math.abs(d[o + 3] - a0) <= TOL; };

    const mask = new Uint8Array(w * h), stack = [sy * w + sx];
    let x0 = sx, x1 = sx, y0 = sy, y1 = sy;
    while (stack.length) {
      const i = stack.pop();
      if (mask[i] || !match(i)) continue;
      const y = (i / w) | 0, row = y * w;
      let xl = i - row, xr = xl;
      while (xl > 0 && !mask[row + xl - 1] && match(row + xl - 1)) xl--;
      while (xr < w - 1 && !mask[row + xr + 1] && match(row + xr + 1)) xr++;
      if (xl === 0 || xr === w - 1 || y === 0 || y === h - 1) return { status: 'open' };
      for (let k = xl; k <= xr; k++) mask[row + k] = 1;
      if (xl < x0) x0 = xl; if (xr > x1) x1 = xr; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let ny = y - 1; ny <= y + 1; ny += 2) {
        const nrow = ny * w;
        for (let k = xl; k <= xr; k++) {
          if (!mask[nrow + k] && match(nrow + k)) {
            stack.push(nrow + k);
            while (k <= xr && !mask[nrow + k] && match(nrow + k)) k++;
          }

      }
    }

    // Grow into the soft edge of the surrounding ink so no pale seam is left.
    // Under-fills only grow into ink (never out the far side of a thin line).
    for (let pass = 0; pass < (under ? 3 : 1); pass++) {
      const add = [];
      const ax0 = Math.max(1, x0 - 1), ax1 = Math.min(w - 2, x1 + 1), ay0 = Math.max(1, y0 - 1), ay1 = Math.min(h - 2, y1 + 1);
      for (let y = ay0; y <= ay1; y++) {
        for (let x = ax0, i = y * w + ax0; x <= ax1; x++, i++) {
          if (mask[i] || !(mask[i - 1] || mask[i + 1] || mask[i - w] || mask[i + w])) continue;
          if (under && d[i * 4 + 3] < TOL) continue;
          add.push(i);
        }
      }
      if (!add.length) break;
      for (const i of add) mask[i] = 1;

    }

    const flow = flowField(mask, w, x0, y0, x1, y1, sx, sy);
    flow.x = b.x + flow.px / kx; flow.y = b.y + flow.py / ky; flow.cw = flow.cell / kx; flow.ch = flow.cell / ky;

      while (out.has(start)) {

        let a = start;
        do { P.push([a % W1, (a / W1) | 0]); a = take(a); } while (a !== start && a !== -1);
        if (P.length < 4) continue;
        // Simplify the pixel staircase: split the loop at its two extremes and reduce each half.
        let far = 0, fd = -1;
        for (let i = 1; i < P.length; i++) { const dd = (P[i][0] - P[0][0]) ** 2 + (P[i][1] - P[0][1]) ** 2; if (dd > fd) { fd = dd; far = i; } }

        if (V.length < 3) continue;
        const flat = [];
        for (const p of V) flat.push(b.x + p[0] / kx, b.y + p[1] / ky);
        rings.push(flat);
      }
    }

  };

  /* How paint poured at the seed would spread through the region: for each cell of a
     coarse grid, the distance the paint has to travel to get there (around obstacles,
     not through them), kept smooth so the front advances evenly like thick paint.
     Used only to animate the fill. */

    const bw = x1 - x0 + 1, bh = y1 - y0 + 1, cell = Math.max(1, Math.ceil(Math.max(bw, bh) / 150));

    const dist = new Float32Array(n).fill(INF), inside = new Uint8Array(n);

      for (let gx = 1; gx < gw - 1; gx++) {
        const px = x0 + (gx - 1) * cell, py = y0 + (gy - 1) * cell;
        let hit = 0;
        for (let y = py; y < py + cell && y <= y1 && !hit; y += step) for (let x = px; x < px + cell && x <= x1; x += step) if (mask[y * w + x]) { hit = 1; break; }
        inside[gy * gw + gx] = hit;
      }
    }
    const seed = (((sy - y0) / cell) | 0) + 1, seedX = (((sx - x0) / cell) | 0) + 1, si = seed * gw + seedX;
    inside[si] = 1; dist[si] = 0;
    // Everywhere the drop point can "see" in a straight line, the paint arrives as a clean
    // circle. Only around corners does it have to travel along the shape (handled below).
    for (let gy = 1; gy < gh - 1; gy++) {
      for (let gx = 1; gx < gw - 1; gx++) {
        const i = gy * gw + gx;
        if (!inside[i]) continue;
        const dx = gx - seedX, dy = gy - seed, steps = Math.max(Math.abs(dx), Math.abs(dy));
        let clear = true;
        for (let k = 1; k < steps && clear; k++) clear = !!inside[Math.round(seed + (dy * k) / steps) * gw + Math.round(seedX + (dx * k) / steps)];
        if (clear) dist[i] = Math.hypot(dx, dy);
      }
    }
    const D = Math.SQRT2;
    for (let iter = 0; iter < 24; iter++) {     // sweep until the distances settle (more sweeps for winding shapes)
      let changed = false;
      for (let i = gw + 1; i < n - gw - 1; i++) {
        if (!inside[i]) continue;
        const d = Math.min(dist[i - 1] + 1, dist[i - gw] + 1, dist[i - gw - 1] + D, dist[i - gw + 1] + D);
        if (d < dist[i] - 1e-3) { dist[i] = d; changed = true; }
      }
      for (let i = n - gw - 2; i > gw; i--) {
        if (!inside[i]) continue;
        const d = Math.min(dist[i + 1] + 1, dist[i + gw] + 1, dist[i + gw + 1] + D, dist[i + gw - 1] + D);
        if (d < dist[i] - 1e-3) { dist[i] = d; changed = true; }
      }
      if (!changed) break;
    }
    // Thick paint has a smooth, rounded front: relax the field a little so no creases
    // show where the flow bends around a corner.
    const tmp = new Float32Array(n);
    for (let pass = 0; pass < 3; pass++) {
      for (let i = gw; i < n - gw; i++) {
        if (!inside[i] || dist[i] >= INF) { tmp[i] = dist[i]; continue; }
        let sum = dist[i] * 2, cnt = 2;
        for (const j of [i - 1, i + 1, i - gw, i + gw]) if (inside[j] && dist[j] < INF) { sum += dist[j]; cnt++; }
        tmp[i] = sum / cnt;
      }
      for (let i = gw; i < n - gw; i++) if (i !== si) dist[i] = tmp[i];
    }
    let max = 0;
    for (let i = 0; i < n; i++) if (inside[i] && dist[i] < INF && dist[i] > max) max = dist[i];
    // Pockets the coarse grid could not reach fill last; cells just outside borrow from
    // their neighbours so the paint runs right up to the outline.
    for (let i = 0; i < n; i++) if (inside[i] && dist[i] >= INF) dist[i] = max;
    const edge = [];
    for (let gy = 0; gy < gh; gy++) {
      for (let gx = 0; gx < gw; gx++) {
        const i = gy * gw + gx;
        if (inside[i]) continue;
        let d = INF;
        if (gx > 0 && inside[i - 1]) d = Math.min(d, dist[i - 1]);
        if (gx < gw - 1 && inside[i + 1]) d = Math.min(d, dist[i + 1]);
        if (gy > 0 && inside[i - gw]) d = Math.min(d, dist[i - gw]);
        if (gy < gh - 1 && inside[i + gw]) d = Math.min(d, dist[i + gw]);

<script>
/* Colour picker popover (hue slider, saturation/brightness map, numeric fields)
   and the pipette with its magnifying loupe. */
(function () {
  'use strict';

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /* ---- Colour maths -------------------------------------------------- */

    const f = (n) => { const k = (n + h / 60) % 6; return Math.round((v - v * s * Math.max(0, Math.min(k, 4 - k, 1))) * 255); };

    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
    let h = 0;
    if (d) { h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
    return [h, mx ? d / mx : 0, mx];

  const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

  el.id = 'picker'; el.className = 'glass';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Color picker');

    '<div class="pk-sv" role="slider" tabindex="0" aria-label="Saturation and brightness"><div class="pk-thumb"></div></div>' +
    '<div class="pk-hue" role="slider" tabindex="0" aria-label="Hue" aria-valuemin="0" aria-valuemax="360"><div class="pk-thumb"></div></div>' +
    '<div class="pk-row">' +
      '<button class="ibtn pk-btn" id="pk-pipette" data-i18n-label="pickColor" data-i18n-title="pickColor">' +
        '<svg viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></button>' +

    '</div>';

  /* ---- State --------------------------------------------------------- */

  sv.addEventListener('keydown', (e) => { const a = ARROWS[e.key]; if (!a) return; e.preventDefault(); s = clamp(s + a[0] * 0.02, 0, 1); v = clamp(v + a[1] * 0.02, 0, 1); render(); emit(); });
  hue.addEventListener('keydown', (e) => { const a = ARROWS[e.key]; if (!a) return; e.preventDefault(); h = clamp(h + (a[0] + a[1]) * 3, 0, 359.999); render(); emit(); });

  /* ---- Numeric fields ------------------------------------------------ */
  fields.addEventListener('change', () => {
    const t = [...fields.querySelectorAll('input')].map((i) => i.value.trim());
    if (format === 'hex') {

      if (m) { let x = m[1]; if (x.length === 3) x = x.replace(/./g, '$&$&'); setRGB(...hex2rgb('#' + x)); }
    } else {

        else { const hh = ((n[0] % 360) + 360) % 360; setRGB(...hsl2rgb(hh, clamp(n[1], 0, 100) / 100, clamp(n[2], 0, 100) / 100)); h = hh; }

    if (item.kind === 'file') {
      const d = WB.parse(await (await item.handle.getFile()).text());
      d.title = label;
      await writeFile(dir, await freeName(dir, clean(label), EXT), WB.serialize(d, d.view));
    } else {
      const name = await freeName(dir, clean(label), '');
      await copyTree(item.handle, await dir.getDirectoryHandle(name, { create: true }));
      await setMeta(dir, name, { label, color: item.color });
    }
  }
  async function move(item, from, to) {
    if (await from.isSameEntry(to)) return;
    if (item.kind === 'dir' && ((await item.handle.isSameEntry(to)) || (await item.handle.resolve(to)))) return;   // not into itself
    if (item.kind === 'file') {
      const name = await freeName(to, clean(stem(item.name)), EXT), wasOpen = await isOpenBoard(from, item.name);
      await writeFile(to, name, await item.handle.getFile());
      await from.removeEntry(item.name);
      if (wasOpen) WB.gallery.ref = { dir: to, name };
    } else {
      const name = await freeName(to, clean(item.label), '');
      await copyTree(item.handle, await to.getDirectoryHandle(name, { create: true }));
      await from.removeEntry(item.name, { recursive: true });
      await setMeta(from, item.name, null);
      await setMeta(to, name, { label: item.label, color: item.color });
    }
  }

  /* Save the open board into the gallery: over its own file if it came from here, otherwise as a new one. */
  async function save() {
    host.commit();
    const state = await connect(true);
    if (state !== 'ready') { pendingSave = true; return open(); }       // choose the folder first, then the save goes ahead
    pendingSave = false;
    const base = clean(host.title());
    let ref = WB.gallery.ref;
    try { if (ref) await ref.dir.getFileHandle(ref.name); } catch (e) { ref = null; }
    if (ref) {
      // Already in the gallery: save over its file. If the board was renamed since, it becomes
      // a new file next to the old one, which is left as it was.
      const unchanged = sameName(stem(ref.name).replace(/ \(\d+\)$/, ''), base);
      return writeBoard(ref.dir, unchanged ? ref.name : await freeName(ref.dir, base, EXT));
    }
    // Not in the gallery yet. With folders to choose from, ask where it goes; otherwise it goes straight in.
    let folders = false;
    try { for await (const h of root.values()) if (h.kind === 'directory') { folders = true; break; } } catch (e) { return fail(e, 'reading the gallery'); }
    if (!folders) return writeBoard(root, await freeName(root, base, EXT));
    saving = true; moving = null; path = [];
    host.openSheet('#gallery');
    show();
  }
  async function writeBoard(dir, name) {
    try {
      const text = host.serialize(), h = await writeFile(dir, name, text);
      if ((await h.getFile()).size === 0 && text.length) throw new Error('the file is empty after writing');
      WB.gallery.ref = { dir, name };
      if (host.saved) host.saved();
      host.toast(tr('tSavedGallery'));
      if ($('#gallery').classList.contains('open')) show();
      if (mode === 'boards' && host.filesCopy && host.filesCopy()) shareCopy(name, text);
      else setTimeout(nudge, 2500);
    } catch (e) { host.report(tr('tSaveFail'), 'saving to the gallery', e); }
  }

  /* ---- A copy in Files (iPhone and iPad) ------------------------------------
     There a website can't write into a folder in Files, but it can hand a file to the share sheet,
     where "Save to Files" (or a Shortcut that saves into a fixed folder, see the README) takes it.
     So with this switched on, every save to the gallery also offers the board's file there. */
  function shareCopy(name, text) {
    const file = new File([text], name, { type: 'application/octet-stream' });
    if (!(navigator.canShare && navigator.canShare({ files: [file] }))) return;
    const go = () => navigator.share({ files: [file] }).catch((e) => {
      if (e.name === 'NotAllowedError') host.toast(tr('tCopyReady'), tr('gShare'), go, 15000);   // the tap went stale while saving
    });
    go();
  }

  /* ---- Changes since the last backup ------------------------------------------
     Each backup remembers a fingerprint of every board it held. Boards that are new or different
     since then are "changes": a changes-only backup holds just those (with all folders and their
     names and colours), and restores like any backup, so several of them can be restored in a row. */
  const fingerprint = (t) => { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + ':' + t.length; };
  const isBoard = (e) => !e.dir && e.path.toLowerCase().endsWith(EXT);
  async function changes() {
    const last = await kvGet(kvKey('Backed'));                 // { at, prints: { path: fingerprint } }
    const entries = await collect(root, '', []);
    return { entries, last, changed: entries.filter((e) => isBoard(e) && (!last || last.prints[e.path] !== fingerprint(e.text))) };
  }
  async function rememberBackup(entries, partial) {
    const prev = partial ? await kvGet(kvKey('Backed')) : null, prints = prev ? { ...prev.prints } : {};
    for (const e of entries) if (isBoard(e)) prints[e.path] = fingerprint(e.text);
    await kvSet(kvKey('Backed'), { at: Date.now(), prints });
  }
  /* A gallery kept by the browser can vanish with the browser's data, so after a save it suggests a
     backup (at most once a day): when 3 or more boards are unsaved in any backup, or any has
     waited 3 days. A gallery in a real folder is already safe and is left alone. */
  async function nudge() {
    if (kind !== 'browser' || !root) return;
    try {
      if (Date.now() - ((await kvGet(kvKey('Nudged'))) || 0) < 20 * 3600e3) return;
      const { changed, last } = await changes();
      const days = last ? (Date.now() - last.at) / 864e5 : 0;
      if (!(changed.length >= 3 || (last && changed.length && days >= 3))) return;
      await kvSet(kvKey('Nudged'), Date.now());
      host.toast(tr('tBackupNudge', { n: changed.length }), tr('gBackupNow'), () => backup(!!last), 12000);
    } catch (e) {}
  }

  /* "Add boards…": board files picked from the device (several at once) go into the folder shown.
     A board already there with the same content is skipped. */
  async function addBoards(files) {
    const dir = here();
    let added = 0;
    try {
      for (const f of files) {
        let text, d;
        try { text = await f.text(); d = WB.parse(text); } catch (e) { continue; }
        let same = false;
        for await (const [n, h] of dir.entries()) {
          if (h.kind === 'file' && n.toLowerCase().endsWith(EXT) && (await (await h.getFile()).text()) === text) { same = true; break; }
        }
        if (same) continue;
        const base = clean(f.name.toLowerCase().endsWith(EXT) ? f.name.slice(0, -EXT.length) : d.title);
        await writeFile(dir, await freeName(dir, base, EXT), text);
        added++;
      }
    } catch (e) { fail(e, 'adding boards'); }
    host.toast(added ? tr('tAddedBoards', { n: added }) : tr('tAddedNone'), null, null, 6000);
    show();
  }

  /* ---- The window ------------------------------------------------------ */
  const FOLDER_ICON = '<svg viewBox="0 0 64 52" aria-hidden="true"><path d="M4 10a6 6 0 0 1 6-6h13.5a6 6 0 0 1 4.6 2.2L31 10h23a6 6 0 0 1 6 6v26a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="currentColor"/><path d="M4 18h56v24a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="#fff" fill-opacity="0.28"/></svg>';
  const FOLDER_COLORS = ['', '#34c759', '#ff9500', '#ff3b30', '#af52de', '#ffcc00', '#ff2d55', '#8e8e93'];   // '' = the default blue
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  async function open() {
    host.commit();
    saving = false;
    host.openSheet('#gallery');
    await show(true);
  }

  /* ---- Stickers --------------------------------------------------------
     A sticker is a small board (a .wbsticker file, in the .whtbd format) holding the objects it
     was made from, moved to start at 0, 0. Saving one opens the sticker gallery to choose its
     folder; afterwards its name is open for typing. Choosing one puts it on the board. */
  async function saveSticker(text, label) {
    host.commit();
    setMode('stickers');
    sticker = { text, label };
    const state = await connect(true);
    if (state !== 'ready') { pendingSave = true; host.openSheet('#gallery'); return show(); }   // choose where stickers live first
    saving = true; moving = null; path = [];
    host.openSheet('#gallery');
    show();
  }
  async function writeSticker(dir) {
    const st = sticker;
    sticker = null; saving = false;
    try {
      const name = await freeName(dir, clean(st.label), EXT);
      await writeFile(dir, name, st.text);
      renameNext = name;                        // ready to be named
      host.toast(tr('tStickerSaved'));
    } catch (e) { fail(e, 'saving the sticker'); }

  }

  /* ---- Drag and drop ---------------------------------------------------
     Pick up a tile by its picture and drop it on a folder, on a step of the path at the top,
     or on the back arrow. With a mouse or pen it lifts as soon as it moves; with a finger it
     lifts after a short press, so that a swipe still scrolls the list. */
  const hyp = Math.hypot;
  let dragging = false, dragged = false;       // dragged: a drag just ended, swallow the click that follows
  document.addEventListener('touchmove', (e) => { if (dragging) e.preventDefault(); }, { passive: false });
  function draggable(icon, tile, item) {
    const ghost = $('#g-ghost');
    let d = null;
    const target = (x, y) => {
      const t = document.elementFromPoint(x, y);
      if (!t) return null;
      const over = t.closest('.g-tile');
      if (over && over !== tile && over._dir) return over;
      const step = t.closest('.g-crumb, #g-back');
      return step && step._dir ? step : null;
    };
    const mark = (t) => { document.querySelectorAll('.drop').forEach((n) => n.classList.remove('drop')); if (t) t.classList.add('drop'); };
    const place = (x, y) => { ghost.style.transform = `translate3d(${x + 14}px, ${y + 14}px, 0)`; mark(target(x, y)); };
    const lift = () => {
      d.on = true; dragging = true;
      try { icon.setPointerCapture(d.id); } catch (e) {}
      ghost.textContent = item.label; ghost.classList.add('on'); tile.classList.add('dragging');
      $('#g-menu').classList.remove('open');
    };
    icon.addEventListener('pointerdown', (e) => {
      if (e.button || moving || saving) return;
      d = { id: e.pointerId, x: e.clientX, y: e.clientY, on: false, touch: e.pointerType === 'touch', timer: 0 };
      if (d.touch) d.timer = setTimeout(() => { if (d && !d.on) { lift(); place(d.x, d.y); } }, 380);
    });
    icon.addEventListener('pointermove', (e) => {
      if (!d || e.pointerId !== d.id) return;
      const far = hyp(e.clientX - d.x, e.clientY - d.y) > 8;
      if (!d.on) {
        if (d.touch) { if (far) { clearTimeout(d.timer); d = null; } return; }   // moved before lifting: it is a scroll
        if (!far) return;
        lift();
      }
      place(e.clientX, e.clientY);
    });
    const end = async (e) => {
      if (!d || e.pointerId !== d.id) return;
      const was = d;
      d = null; clearTimeout(was.timer);
      if (!was.on) return;
      dragging = false; ghost.classList.remove('on'); tile.classList.remove('dragging');
      const t = e.type === 'pointerup' ? target(e.clientX, e.clientY) : null;
      mark(null);
      dragged = true; setTimeout(() => { dragged = false; }, 150);
      if (!t) return;
      try { await move(item, here(), t._dir); } catch (err) { fail(err, 'moving'); }
      show();
    };
    icon.addEventListener('pointerup', end);
    icon.addEventListener('pointercancel', end);
  }
  /* Say what went wrong and at which step, in the browser's own words, so a failure is never silent.
     The same line stays visible in the gallery window until something succeeds. */
  let lastError = '';
  function fail(e, step) {
    step = step || 'gallery';
    lastError = `${step}: ${e ? (e.name || 'Error') + (e.message ? ': ' + e.message : '') : 'failed'}`;
    host.report(tr('gError'), step, e);
  }

  /* Draw the current state: setup, permission request, or the folder being browsed. */
  async function show(ask) {
    const my = ++token, grid = $('#g-grid'), msg = $('#g-msg');
    let state;
    if (inBuiltin()) state = 'ready';                       // part of the app: nothing to connect to
    else { try { state = await connect(!!ask); } catch (e) { state = 'setup'; } }
    if (my !== token) return;
    const browsing = state === 'ready', builtinTile = !browsing && mode === 'stickers';
    grid.hidden = !browsing && !builtinTile; msg.hidden = browsing;
    $('#g-crumbs').hidden = !browsing;
    $('#g-new').hidden = !browsing || inBuiltin();
    $('#g-new-board').hidden = !browsing || mode !== 'boards';
    $('#gallery-title').textContent = tr(cfg.title);
    const back = $('#g-back');
    back.disabled = !browsing || !path.length;
    back._dir = browsing && path.length ? (path.length > 1 ? path[path.length - 2].handle : root) : null;   // also a drop target
    if (isBuiltin(back._dir)) back._dir = null;                 // nothing is dropped into the built-in stickers
    renderBar(); renderFoot(browsing);
    if (!browsing) {
      msg.textContent = '';
      msg.appendChild(el('p', '', tr(state === 'allow' ? 'gAllow' : state === 'none' ? 'gError' : cfg.setup)));
      if (state === 'setup' && canDrop()) msg.appendChild(el('p', '', tr('gDrop')));
      const row = el('div', 'g-actions');
      if (state === 'allow') row.appendChild(button(tr('gAllowBtn'), 'primary', () => show(true)));
      if (state === 'setup' || state === 'allow') row.appendChild(button(tr(state === 'allow' ? 'gChange' : 'gChoose'), state === 'allow' ? 'pill-btn quiet' : 'primary', pickFolder));
      if (state === 'setup' && canUseBrowser()) row.appendChild(button(tr('gPrivate'), 'pill-btn quiet', async () => { try { await useBrowser(); afterConnect(); } catch (e) { fail(e); } }));
      msg.appendChild(row);
      if (lastError) msg.appendChild(el('p', 'g-error', lastError));
      if (builtinTile) { grid.textContent = ''; grid.appendChild(builtinTileEl()); }   // usable before a sticker folder is chosen
      return;
    }
    // Breadcrumbs
    const crumbs = $('#g-crumbs');
    crumbs.textContent = '';
    [{ label: tr(cfg.title) }, ...path].forEach((p, i) => {
      if (i) crumbs.appendChild(el('span', 'g-sep', '›'));
      const b = el('button', i === path.length ? 'g-crumb here' : 'g-crumb', p.label);
      b._dir = isBuiltin(p.handle) ? null : p.handle || root;     // nothing can be dropped into the built-in stickers
      b.addEventListener('click', () => { path = path.slice(0, i); show(); });
      crumbs.appendChild(b);
    });
    // Tiles
    let items;
    try { items = await list(here()); }
    catch (e) {
      // The folder is gone or unreadable. Back to the top once; if the gallery folder itself fails, ask for it again.
      fail(e);
      if (path.length) { path = []; return show(); }
      root = null; await kvSet(kvKey('Dir'), null);
      return show();
    }
    if (my !== token) return;
    grid.textContent = '';
    if (mode === 'stickers' && !path.length) grid.appendChild(builtinTileEl());
    if (!items.length && !(mode === 'stickers' && !path.length)) grid.appendChild(el('p', 'g-empty', tr('gEmpty')));
    const files = [];
    let cat = null;
    for (const item of items) {
      if (item.cat && item.cat !== cat) { cat = item.cat; grid.appendChild(el('h3', 'g-cat', cat)); }
      if (item.builtin) { const t = builtinTileEl(item); grid.appendChild(t); if (item.kind === 'file') files.push({ item, icon: t.firstChild, name: t.lastChild }); continue; }
      const tile = el('div', 'g-tile'), icon = el('button', 'g-icon'), more = el('button', 'g-more', '⋯'), name = el('button', 'g-name', item.label);
      if (item.kind === 'dir') { icon.innerHTML = FOLDER_ICON; if (item.color) icon.style.color = item.color; tile._dir = item.handle; }
      else files.push({ item, icon, name });
      icon.setAttribute('aria-label', tr('gOpen') + ': ' + item.label);
      icon.addEventListener('click', () => { if (dragged) { dragged = false; return; } openItem(item); });
      draggable(icon, tile, item);
      if (renameNext === item.name) { renameNext = null; setTimeout(() => { if (name.isConnected) editName(item, name); }, 0); }
      name.addEventListener('click', () => editName(item, name));
      more.setAttribute('aria-label', item.label);
      more.addEventListener('click', (e) => { e.stopPropagation(); itemMenu(item, more); });
      tile.addEventListener('contextmenu', (e) => { e.preventDefault(); itemMenu(item, more); });
      tile.append(icon, more, name);
      grid.appendChild(tile);
    }
    // Previews and real titles, one file at a time so a big folder stays responsive.
    for (const f of files) {
      if (my !== token) return;
      try {
        const d = WB.parse(await (await f.item.handle.getFile()).text());
        if (my !== token) return;
        if (d.title && d.title !== 'Untitled') { f.item.label = d.title; if (f.name.isConnected && f.name.tagName === 'BUTTON') f.name.textContent = d.title; }
        const first = d.pages.slice(0, 1);                       // a sheet shows its first page
        await WB.loadImages(d.strokes, first);
        if (my !== token) return;
        f.icon.appendChild(preview(d.strokes, first));
      } catch (e) { f.icon.classList.add('broken'); }
      await new Promise((r) => setTimeout(r, 0));
    }
  }
  function button(text, cls, fn) { const b = el('button', cls, text); b.addEventListener('click', fn); return b; }
  /* A tile of the built-in stickers (the folder itself when no item is given): it opens, and that is all. */
  function builtinTileEl(item) {
    item = item || { kind: 'dir', name: 'builtin', handle: BUILTIN, label: tr('sBuiltIn'), builtin: true, top: true };
    const tile = el('div', 'g-tile builtin'), icon = el('button', 'g-icon'), name = el('span', 'g-name', item.label);
    if (item.kind === 'dir') { icon.innerHTML = item.top ? BUILTIN_ICON : FOLDER_ICON; icon.style.color = BUILTIN_COLOR; }
    icon.setAttribute('aria-label', tr('gOpen') + ': ' + item.label);
    icon.title = item.label;
    icon.addEventListener('click', () => openItem(item));
    tile.append(icon, name);
    return tile;
  }

  function preview(strokes, pages) {
    const b = WB.contentBounds(strokes), bg = host.canvasColor();
    let c;
    if (pages && pages.length) {
      const box = pages[0];
      c = WB.renderToCanvas(strokes, box, Math.min(360 / box.w, 270 / box.h, 4), bg, pages).canvas;
    } else if (b) {
      const pad = Math.max(b.w, b.h) * 0.08 + 4, box = { x: b.x - pad, y: b.y - pad, w: b.w + 2 * pad, h: b.h + 2 * pad };
      c = WB.renderToCanvas(strokes, box, Math.min(360 / box.w, 270 / box.h, 4), bg).canvas;
    } else {
      c = document.createElement('canvas'); c.width = 8; c.height = 6;
      const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, 8, 6);
    }
    c.style.background = bg;
    return c;
  }

  function openItem(item) {
    if (item.kind === 'dir') { path.push({ handle: item.handle, label: item.label }); return show(); }
    if (moving || saving) return;
    const dir = here();
    item.handle.getFile().then((f) => f.text()).then((text) => {
      host.closeSheets();
      if (mode === 'stickers') host.placeSticker(text, { exact: !!item.builtin, group: !!item.builtin });   // built-in ones at the size they were drawn for, as one group
      else host.load(text, { dir, name: item.name });
    }).catch(fail);
  }

  /* Rename in place: the name becomes a text field. */
  function editName(item, nameEl) {
    const input = el('input', 'g-name-edit');
    input.type = 'text'; input.value = item.label; input.maxLength = 80; input.spellcheck = false;
    nameEl.replaceWith(input);
    input.focus(); input.select();
    let done = false;
    const finish = async (commit) => {
      if (done) return;
      done = true;
      const dir = here();
      if (commit && input.value.trim() && input.value.trim() !== item.label) { try { await rename(dir, item, input.value); } catch (e) { fail(e); } }
      show();
    };
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') finish(true);
      else if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }

  function itemMenu(item, anchor) {
    const menu = $('#g-menu'), dir = here();
    menu.textContent = '';
    const add = (label, fn, danger) => { const b = el('button', 'mi' + (danger ? ' danger' : ''), label); b.addEventListener('click', () => { menu.classList.remove('open'); fn(); }); menu.appendChild(b); };
    add(tr('gOpen'), () => openItem(item));
    add(tr('gRename'), () => { const n = [...document.querySelectorAll('#g-grid .g-name')].find((b) => b.previousSibling === anchor); if (n) editName(item, n); });
    add(tr('gDuplicate'), async () => { try { await duplicate(dir, item); } catch (e) { fail(e); } show(); });
    add(tr('gMove'), () => { moving = { item, from: dir }; renderBar(); });
    add(tr('delete'), () => { renderBar({ ask: tr('gDeleteAsk', { t: item.label }), yes: tr('delete'), danger: true, run: async () => { try { await remove(dir, item); } catch (e) { fail(e); } show(); } }); }, true);
    if (item.kind === 'dir') {                                         // folder colour
      const row = el('div', 'g-colors');
      for (const c of FOLDER_COLORS) {
        const b = el('button', 'swatch');
        b.style.setProperty('--c', c || 'var(--accent)');
        b.setAttribute('aria-checked', String((item.color || '') === c));
        b.setAttribute('aria-label', c || 'blue');
        b.addEventListener('click', async () => {
          menu.classList.remove('open');
          try { await setMeta(dir, item.name, { label: item.label, color: c }); } catch (e) { fail(e, 'colouring'); }
          show();
        });
        row.appendChild(b);
      }
      menu.appendChild(row);
    }
    const r = anchor.getBoundingClientRect();
    menu.classList.add('open');
    menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + 'px';
    menu.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - menu.offsetHeight - 8)) + 'px';
  }

  /* The strip at the bottom: asks before deleting, or shows where a move is going. */
  function renderBar(confirm) {
    const bar = $('#g-bar');
    bar.textContent = '';
    if (confirm) {
      bar.appendChild(el('span', '', confirm.ask));
      bar.appendChild(button(tr('cancel'), 'pill-btn quiet', () => renderBar()));
      bar.appendChild(button(confirm.yes, 'pill-btn' + (confirm.danger ? ' danger' : ''), () => { renderBar(); confirm.run(); }));
    } else if (saving && mode === 'stickers' && sticker) {
      bar.appendChild(el('span', '', tr(inBuiltin() ? 'sBuiltInNoSave' : 'sSaving')));
      bar.appendChild(button(tr('cancel'), 'pill-btn quiet', () => { saving = false; sticker = null; host.closeSheets(); }));
      if (!inBuiltin()) bar.appendChild(button(tr('gSaveHere'), 'pill-btn', () => writeSticker(here())));
    } else if (saving) {
      bar.appendChild(el('span', '', tr('gSaving', { t: host.title() })));
      bar.appendChild(button(tr('cancel'), 'pill-btn quiet', () => { saving = false; host.closeSheets(); }));
      bar.appendChild(button(tr('gSaveHere'), 'pill-btn', async () => {
        saving = false;
        const dir = here();
        host.closeSheets();
        writeBoard(dir, await freeName(dir, clean(host.title()), EXT));
      }));
    } else if (moving) {
      bar.appendChild(el('span', '', tr('gMoving', { t: moving.item.label })));

<script>
/* Share links: a whole board packed into the part of a link after "#b=".

   The fragment never leaves the browser (it is not sent to the server), so the board stays
   between the people who have the link. Links get long quickly, so the board is packed tightly:

     1. Strokes are simplified (Ramer-Douglas-Peucker) with a tolerance well under a pixel.
     2. Points are rounded to a grid fine enough for the stroke: a quarter of its width, at most
        half a unit, so writing done while zoomed far in survives.
     3. After the first point, each point is stored as its step from the one before, as a zigzag
        varint: most steps fit in one byte.
     4. Binary layout, with a colour table so each colour is written once.
     5. The result is deflated and written as base64url.

   Layout (version 1); "uv"/"sv" are unsigned/signed varints, "f" a float32, "str" a uv length + UTF-8:
     u8 version · str title · uv pages, each f x, y, w, h · uv colours, each 3 bytes RGB · uv objects:
       u8 kind 0 pen, 1 eraser:  u8 flags (1 smooth, 2 closed, 4 highlighter, 8 pressure, 16 shape, 32 dash)
                                 [uv colour] f width · u8 opacity · [u8 dash] [str shape] · points · [u8 pressure per point]
       u8 kind 2 text:           f x, y, rot, size · u8 font · uv colour · u8 opacity · str text
       u8 kind 3 fill:           uv colour · u8 opacity · u8 under · uv rings, each: points
       u8 kind 4 graph:          f x, y, w, h, rot · u8 opacity · f64 cx, cy, span · uv functions, each: uv colour · str source
       u8 kind 5 maths text:     as kind 2 (the text holds $…$ maths)
       u8 kind 6 erasing:        of the object just before it: uv erasers, each: f width · u8 opacity · u8 smooth · points
       u8 kind 7 groups:         of the object just before it: uv count, each: uv group number (1, 2, ... in order of appearance)
     points = u8 (grid exponent + 8) · uv count · sv x0, y0 (in grid steps) · sv dx, dy ...
   Pictures (and the page pictures of an opened PDF) are left out: they would make links far too long. */

        o.d(s.cx); o.d(s.cy); o.d(s.span);
        o.uv(s.fns.length);
        for (const q of s.fns) { o.uv(color(q.color)); o.str(q.src); }
      } else if (s.tool === 'fill') {
        o.u8(3); o.uv(color(s.color)); o.u8(opacityByte(s.opacity)); o.u8(s.under ? 1 : 0);
        const b = WB.boundsOf(s), e = gridExp(Math.min(0.5, Math.max(b.x1 - b.x0, b.y1 - b.y0) / 1500));
        o.uv(s.rings.length);
        for (const r of s.rings) putPoints(o, r, simplify(r, Math.pow(2, -e) * 0.6, true), e);
      } else {
        const pen = s.tool === 'pen', press = WB.hasPress(s), dash = pen && !s.hl ? DASHES.indexOf(s.dash) : -1;

        o.u8(pen ? 0 : 1); o.u8(flags);
        if (pen) o.uv(color(s.color));
        o.f(s.width); o.u8(opacityByte(s.opacity));
        if (dash >= 0) o.u8(dash);
        if (s.shape) o.str(s.shape);
        const e = gridExp(Math.min(0.5, s.width / 4));
        let idx = simplify(s.points, Math.pow(2, -e) * 0.6, s.closed);
        if (press) idx = keepPressure(idx, s.press);

    const np = r.uv();

    const nc = r.uv();
    for (let i = 0; i < nc; i++) colors.push('#' + [r.u8(), r.u8(), r.u8()].map((v) => v.toString(16).padStart(2, '0')).join(''));
    const col = (i) => colors[i] || '#000000';
    const n = r.uv();
    for (let i = 0; i < n || (r.n < r.b.length && (r.b[r.n] === 6 || r.b[r.n] === 7)); i++) {   // (the last object's erasing and groups come after it)
      const kind = r.u8();
      if (kind === 2 || kind === 5) {
        const x = r.f(), y = r.f(), rot = r.f(), size = r.f(), font = FONTS[r.u8()] || 'sans', color = col(r.uv()), opacity = r.u8() / 255, t = r.str();
        strokes.push({ tool: 'text', x, y, rot: (rot * 180) / Math.PI, text: t, font, size, color, opacity, math: kind === 5 });
      } else if (kind === 6) {
        const ne = r.uv(), erase = [];
        if (ne > r.b.length - r.n) throw new Error('the link is damaged');
        for (let j = 0; j < ne; j++) { const width = r.f(), opacity = r.u8() / 255, smooth = !!r.u8(); erase.push({ width, opacity, smooth, points: getPoints(r) }); }
        if (strokes.length) strokes[strokes.length - 1].erase = erase;
        i--;                                   // part of the object before it, not an object of its own
      } else if (kind === 7) {
        const ng = r.uv(), group = [];
        if (ng > r.b.length - r.n) throw new Error('the link is damaged');
        for (let j = 0; j < ng; j++) group.push(r.uv());
        if (strokes.length) strokes[strokes.length - 1].group = group;
        i--;
      } else if (kind === 4) {
        const x = r.f(), y = r.f(), w = r.f(), h = r.f(), rot = r.f(), opacity = r.u8() / 255, cx = r.d(), cy = r.d(), span = r.d(), nf = r.uv(), fns = [];
        if (nf > r.b.length - r.n) throw new Error('the link is damaged');
        for (let j = 0; j < nf; j++) { const color = col(r.uv()); fns.push({ color, src: r.str() }); }
        strokes.push({ tool: 'plot', x, y, w, h, rot: (rot * 180) / Math.PI, opacity, cx, cy, span, fns });
      } else if (kind === 3) {
        const color = col(r.uv()), opacity = r.u8() / 255, under = !!r.u8(), nr = r.uv(), rings = [];
        for (let j = 0; j < nr; j++) rings.push(getPoints(r));
        strokes.push({ tool: 'fill', color, opacity, under, rings });
      } else if (kind === 0 || kind === 1) {
        const flags = r.u8(), s = { tool: kind === 0 ? 'pen' : 'eraser' };
        if (kind === 0) s.color = col(r.uv());
        s.width = r.f(); s.opacity = r.u8() / 255;
        if (flags & 32) s.dash = DASHES[r.u8()];
        if (flags & 16) s.shape = r.str();
        s.points = getPoints(r);
        s.smooth = !!(flags & 1); s.closed = !!(flags & 2);
        if (flags & 4) s.highlight = true;
        if (flags & 8) { s.pressure = []; for (let j = 0; j < s.points.length; j++) s.pressure.push(Math.round((r.u8() / 255) * 100)); }
        strokes.push(s);
      } else throw new Error('unknown object ' + kind);
    }
    return WB.normalize({ title, strokes, pages, created: new Date().toISOString() });
  }

  WB.share = { encode, decode };
})();

<script>
/* Whiteboard: QR codes, for joining a live board from a phone (the share window shows one).

   A small encoder for short texts: byte mode, error correction level M (about 15 % of the code
   can be damaged or covered), versions 1-6 (up to 106 bytes, plenty for an address with a room
   code), and the mask that makes the code easiest to read, chosen by the standard's penalty rules.

   WB.qr(text) -> { size, dark(x, y) }        (no quiet zone; leave 4 modules of margin around it)
   WB.qrSvg(text, scale) -> '<svg …>'         (black on white, with the quiet zone) */
(function () {
  const WB = window.WB;
  // Per version (index 1-6), level M: [error correction codewords per block, [data codewords of each block]].
  const BLOCKS = [null, [10, [16]], [16, [28]], [26, [44]], [18, [32, 32]], [24, [43, 43]], [16, [27, 27, 27, 27]]];
  const ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34]];

  // ---- Reed-Solomon over GF(256), polynomial 0x11D ----
  function mul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; }
    return z;
  }
  function divisor(degree) {
    const r = new Array(degree).fill(0);
    r[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < degree; j++) { r[j] = mul(r[j], root); if (j + 1 < degree) r[j] ^= r[j + 1]; }
      root = mul(root, 2);
    }
    return r;
  }
  function remainder(data, div) {
    const r = new Array(div.length).fill(0);
    for (const b of data) {
      const f = b ^ r.shift();
      r.push(0);
      div.forEach((c, i) => { r[i] ^= mul(c, f); });
    }
    return r;
  }

  function encode(text, mask) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let version = 1;
    while (version <= 6 && 4 + 8 + bytes.length * 8 > BLOCKS[version][1].reduce((a, b) => a + b, 0) * 8) version++;
    if (version > 6) throw new Error('text too long for a QR code here');
    const [ecLen, blockSizes] = BLOCKS[version];
    const capacity = blockSizes.reduce((a, b) => a + b, 0) * 8;

    // Bits: mode 0100 (bytes), 8-bit length, the bytes, a terminator, then padding.
    const bits = [];
    const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, 8);
    for (const b of bytes) put(b, 8);
    put(0, Math.min(4, capacity - bits.length));
    while (bits.length % 8) bits.push(0);
    for (let pad = 0xec; bits.length < capacity; pad ^= 0xec ^ 0x11) put(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }

    // Blocks, each with its error correction, interleaved.
    const div = divisor(ecLen), blocks = [];
    let k = 0;
    for (const n of blockSizes) { const d = data.slice(k, k + n); k += n; blocks.push({ d, e: remainder(d, div) }); }
    const words = [];
    for (let i = 0; i < Math.max(...blockSizes); i++) for (const b of blocks) if (i < b.d.length) words.push(b.d[i]);
    for (let i = 0; i < ecLen; i++) for (const b of blocks) words.push(b.e[i]);

    // ---- The grid ----
    const size = version * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }      // timing
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {                          // finders and their separators
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy));
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
      }
    }
    const al = ALIGN[version], last = al.length - 1;
    for (let i = 0; i < al.length; i++) for (let j = 0; j < al.length; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const format = (mask) => {
      const v = (0 << 3) | mask;                         // level M is 00
      let r = v;
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const f = ((v << 10) | r) ^ 0x5412, bit = (i) => ((f >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, true);                            // the dark module
    };
    format(0);                                           // (reserves those places)

    // Codewords, in the zigzag from the bottom right.
    let n = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
        if (fn[y][x] || n >= words.length * 8) continue;
        mod[y][x] = ((words[n >>> 3] >>> (7 - (n & 7))) & 1) === 1;
        n++;
      }
    }

    const MASKS = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0, (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
    ];
    const flip = (m) => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && MASKS[m](x, y)) mod[y][x] = !mod[y][x]; };
    let best = 0, low = Infinity;
    for (let m = 0; m < 8; m++) {
      flip(m); format(m);
      const p = penalty(mod, size);
      if (p < low) { low = p; best = m; }
      flip(m);
    }
    if (mask >= 0 && mask < 8) best = mask;            // (a given mask: for testing)
    flip(best); format(best);
    return { size, version, dark: (x, y) => mod[y][x] };
  }

  /* The standard's penalty: long runs, 2×2 blocks, finder-like patterns, and an uneven dark/light balance. */
  function penalty(m, size) {
    let p = 0, dark = 0;
    const lines = [];
    for (let i = 0; i < size; i++) { lines.push(m[i]); lines.push(m.map((row) => row[i])); }
    for (const line of lines) {
      let run = 1;
      for (let i = 1; i <= size; i++) {
        if (i < size && line[i] === line[i - 1]) { run++; continue; }
        if (run >= 5) p += 3 + run - 5;
        run = 1;
      }
      for (let i = 0; i + 7 <= size; i++) {               // 1:1:3:1:1 with 4 light modules on either side
        if (!(line[i] && !line[i + 1] && line[i + 2] && line[i + 3] && line[i + 4] && !line[i + 5] && line[i + 6])) continue;
        const before = i >= 4 && !line[i - 1] && !line[i - 2] && !line[i - 3] && !line[i - 4];
        const after = i + 11 <= size && !line[i + 7] && !line[i + 8] && !line[i + 9] && !line[i + 10];
        if (before || after) p += 40;
      }
    }
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (m[y][x]) dark++;
      if (x < size - 1 && y < size - 1 && m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
    }
    p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
    return p;
  }

  WB.qr = encode;
  WB.qrSvg = function (text, scale) {
    const q = encode(text), quiet = 4, n = q.size + quiet * 2;
    let d = '';
    for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.dark(x, y)) d += `M${x + quiet} ${y + quiet}h1v1h-1z`;
    const px = n * (scale || 4);
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  };
})();

<script>
/* Whiteboard: browsers talking straight to each other (WebRTC), for live boards.

   Finding each other ("signalling") goes through public WebTorrent trackers: free, no account,
   and several at once, so one being down doesn't matter. A tracker only ever sees
     - a hash of the room (SHA-1 of the room code), never the code itself, and
     - the connection offers and answers, encrypted with a key made from the room code (AES-GCM),
       so it can't read the network addresses inside them either.
   STUN servers (Google, Cloudflare) tell each browser its public address so they can reach each
   other through home routers. After that, everything goes over an encrypted (DTLS) data channel
   directly between the browsers; the trackers aren't needed any more. With more than two people,
   everyone connects to everyone (fine for a handful of people).
   Some networks block direct connections; a TURN relay of the user's own (in Settings) gets
   through those. None is built in: a password in public code would be anyone's to use up.

   WB.p2p.join(room, { ice, onPeer(id), onLeave(id), onMessage(id, msg), onStatus(st) }) -> room
     room.send(msg, to?)   a JSON-able message to one peer, or to all of them
     room.leave()
   Messages of any size: long ones are cut into pieces and put together again on arrival. */
(function () {
  const WB = window.WB;
  const TRACKERS = ['wss://tracker.openwebtorrent.com', 'wss://tracker.webtorrent.dev', 'wss://tracker.files.fm:7073/announce'];
  const STUN = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
  const OFFERS = 5;            // ready-made offers handed to each tracker, for that many newcomers
  const ANNOUNCE_MS = 30000;   // re-announce (with fresh offers) this often
  const CONNECT_MS = 15000;    // give a connection this long to open
  const MAX_PEERS = 12;
  const PIECE = 16000;         // characters per data channel message (safe in every browser)

  const enc = new TextEncoder(), dec = new TextDecoder();
  const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
  const bin = (bytes) => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return s; };
  const hex = (s) => [...s].map((c) => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
  const b64 = (bytes) => btoa(bin(bytes));
  const unb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));

  async function roomKeys(room) {
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-1', enc.encode('whiteboard-room:' + room)));
    const raw = await crypto.subtle.digest('SHA-256', enc.encode('whiteboard-key:' + room));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
    return { infoHash: bin(hash), key };
  }
  async function seal(key, text) {
    const iv = rand(12), ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text)));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
    return b64(out);
  }
  async function unseal(key, t) {
    const all = unb64(t);
    return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.subarray(0, 12) }, key, all.subarray(12)));
  }
  /* Wait until the connection knows all its addresses (the trackers carry one offer, no updates). */
  const gathered = (pc) => new Promise((res) => {
    if (pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 4000);
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
  });

  async function join(room, h) {
    const { infoHash, key } = await roomKeys(room);
    const myId = bin(rand(20)), me = hex(myId);
    const ice = { iceServers: STUN.concat(h.ice || []) };
    const peers = new Map();        // peer id (hex) -> { pc, dc, offerer, open, timer, parts }
    let offers = new Map();         // offer id -> { pc, dc }  (this round's, not yet answered)
    let left = false, others = false, failed = 0;
    const sockets = [];

    const status = () => {
      if (left) return;
      let open = 0, connecting = 0;
      for (const p of peers.values()) if (p.open) open++; else connecting++;
      h.onStatus({ me, peers: open, connecting, trackers: sockets.filter((s) => s.ws && s.ws.readyState === 1).length, others, failed });
    };

    /* ---- One peer ---- */
    function bindChannel(id, p, dc) {
      p.dc = dc;
      dc.bufferedAmountLowThreshold = 256 * 1024;
      dc.onopen = () => {
        if (peers.get(id) !== p || left) return dc.close();
        p.open = true; clearTimeout(p.timer); failed = 0;
        h.onPeer(id); status();
      };
      dc.onclose = () => drop(id, p);
      dc.onmessage = (e) => receive(id, p, e.data);
      dc.onbufferedamountlow = () => pump(p);
    }
    /* Keep at most one connection per peer. When two appear at once (each answered the other's
       offer), both sides keep the one offered by the smaller id, so they keep the same one. */
    function register(id, pc, offerer) {
      const old = peers.get(id);
      if (old) {
        if (old.offerer <= offerer) { pc.close(); return null; }
        drop(id, old, true);
      }
      if (peers.size >= MAX_PEERS) { pc.close(); return null; }
      const p = { pc, dc: null, offerer, open: false, queue: [], parts: new Map() };
      p.timer = setTimeout(() => { if (!p.open) { failed++; drop(id, p); } }, CONNECT_MS);
      pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' || pc.connectionState === 'closed') { if (!p.open) failed++; drop(id, p); } };
      peers.set(id, p);
      status();
      return p;
    }
    function drop(id, p, quiet) {
      if (peers.get(id) !== p) return;
      peers.delete(id);
      clearTimeout(p.timer);
      try { p.dc && p.dc.close(); } catch (e) {}
      try { p.pc.close(); } catch (e) {}
      if (p.open && !quiet) h.onLeave(id);
      status();
    }

    /* ---- Messages ---- */
    let msgNo = 0;
    function send(msg, to) {
      const text = JSON.stringify(msg);
      const chunks = [];
      if (text.length <= PIECE) chunks.push(text);
      else {
        const n = Math.ceil(text.length / PIECE), tag = (++msgNo).toString(36);
        for (let i = 0; i < n; i++) chunks.push('\u0001' + tag + ':' + i + ':' + n + ':' + text.slice(i * PIECE, (i + 1) * PIECE));
      }
      for (const [id, p] of peers) {
        if (!p.open || (to && to !== id)) continue;
        p.queue.push(...chunks);
        pump(p);
      }
    }
    function pump(p) {
      const dc = p.dc;
      while (p.queue.length && dc && dc.readyState === 'open' && dc.bufferedAmount < 1024 * 1024) {
        try { dc.send(p.queue.shift()); } catch (e) { return; }
      }
    }
    function receive(id, p, data) {
      if (typeof data !== 'string') return;
      if (data.charCodeAt(0) === 1) {
        const a = data.indexOf(':'), b = data.indexOf(':', a + 1), c = data.indexOf(':', b + 1);
        const tag = data.slice(1, a), i = +data.slice(a + 1, b), n = +data.slice(b + 1, c);
        if (!(n > 0 && n < 100000 && i >= 0 && i < n)) return;
        let m = p.parts.get(tag);
        if (!m) { if (p.parts.size > 8) return; m = { n, got: 0, list: new Array(n) }; p.parts.set(tag, m); }
        if (m.list[i] == null) { m.list[i] = data.slice(c + 1); m.got++; }
        if (m.n >= 4 && h.onProgress) h.onProgress(id, m.got, m.n);    // a big message on its way (a whole board, a picture)
        if (m.got < m.n) return;
        p.parts.delete(tag);
        data = m.list.join('');
