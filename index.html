<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Whiteboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
  // Resolve the theme before first paint so there is no light/dark flash.
  (function () {
    var s = {}, t;
    try { s = JSON.parse(localStorage.getItem('wb.settings')) || {}; } catch (e) {}
    t = s.theme || 'system';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var c = s.canvas === 'light' ? '#ffffff' : s.canvas === 'dark' ? '#1c1c1e' : s.canvas === 'custom' ? s.canvasCustom : '';
    if (c) document.documentElement.style.setProperty('--canvas', c);
  })();
</script>
</head>
<body>

<main id="board" data-grid="dots">
  <canvas id="canvas" aria-label="Whiteboard canvas"></canvas>
  <textarea id="text-edit" rows="1" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-label="text"></textarea>
  <div id="brush-cursor" aria-hidden="true"></div>
  <div id="laser" aria-hidden="true"></div>
  <button class="glass page-add" id="page-add-top" data-i18n-label="addPageAbove" data-i18n-title="addPageAbove"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="glass page-add" id="page-add-bottom" data-i18n-label="addPageBelow" data-i18n-title="addPageBelow"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="glass page-add page-del" id="page-del-top" data-i18n-label="deletePage" data-i18n-title="deletePage"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6M18.5 6l-.8 13a2 2 0 0 1-2 1.9H8.3a2 2 0 0 1-2-1.9L5.5 6M10 11v6M14 11v6"/></svg></button>
  <button class="glass page-add page-del" id="page-del-bottom" data-i18n-label="deletePage" data-i18n-title="deletePage"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6M18.5 6l-.8 13a2 2 0 0 1-2 1.9H8.3a2 2 0 0 1-2-1.9L5.5 6M10 11v6M14 11v6"/></svg></button>
  <p id="hint" class="gone"><span data-i18n="hint1"></span><br><span data-i18n="hint2"></span><br><span data-i18n="hint3"></span></p>
</main>

<!-- Top left: file -->
<header class="glass bar" id="bar-file">
  <button class="ibtn" id="btn-menu" data-i18n-label="menu" aria-haspopup="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <input id="doc-title" type="text" value="" data-i18n-label="boardName" spellcheck="false" autocomplete="off" maxlength="80">
</header>

<!-- Top right: history + zoom -->
<div class="glass bar" id="bar-view">
  <button class="ibtn" id="btn-undo" data-i18n-label="undo" data-i18n-title="undo" data-keys="Ctrl+Z" disabled>
    <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <button class="ibtn" id="btn-redo" data-i18n-label="redo" data-i18n-title="redo" data-keys="Ctrl+Shift+Z" disabled>
    <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
  </button>
  <span class="sep"></span>
  <button class="tbtn" id="btn-zoom" data-i18n-label="zoom" aria-haspopup="menu" aria-expanded="false">100%</button>
</div>

<!-- Left: size + opacity -->
<aside class="glass" id="side">
  <div class="vslider" id="sl-size" role="slider" tabindex="0" data-i18n-label="thickness" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
    <div class="vslider-fill"></div>
    <svg class="vslider-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/></svg>
  </div>
  <div class="vslider" id="sl-opacity" role="slider" tabindex="0" data-i18n-label="opacity" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
    <div class="vslider-fill"></div>
    <svg class="vslider-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 0 1 0 14z" fill="currentColor" stroke="none"/></svg>
  </div>
  <button class="dash-btn" id="btn-dash" data-i18n-label="lineType" data-i18n-title="lineType" aria-haspopup="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path id="dash-icon" d="M3 12h18"/></svg>
  </button>
</aside>
<div class="glass" id="preview" aria-hidden="true">
  <div id="preview-stage"><div id="preview-dot"></div></div>
  <div id="preview-label">4 px</div>
</div>

<!-- Bottom: tools + colours -->
<nav class="glass" id="dock">
  <button class="ibtn tool" data-tool="pen" data-i18n-label="pen" data-i18n-title="pen" data-keys="P" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
  </button>
  <button class="ibtn tool" data-tool="highlighter" data-i18n-label="highlighter" data-i18n-title="highlighter" data-keys="M" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
  </button>
  <button class="ibtn tool" data-tool="eraser" data-i18n-label="eraser" data-i18n-title="eraser" data-keys="E" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
  </button>
  <button class="ibtn tool" data-tool="text" data-i18n-label="text" data-i18n-title="text" data-keys="T" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
  </button>
  <button class="ibtn" id="btn-sticker" data-i18n-label="addSticker" data-i18n-title="addSticker" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9.5L21 14.5V5a2 2 0 0 0-2-2z"/><path d="M14.5 21v-4.5a2 2 0 0 1 2-2H21"/><path d="M8.5 9.5h.01M14.5 9.5h.01"/><path d="M8.5 13.5c1.8 1.6 4.2 1.6 6 0"/></svg>
  </button>
  <button class="ibtn tool" data-tool="select" data-i18n-label="select" data-i18n-title="select" data-keys="V" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M3 11 22 2l-9 19-2-8-8-2z"/></svg>
  </button>
  <button class="ibtn tool" data-tool="hand" data-i18n-label="move" data-i18n-title="move" data-keys="H / Space" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
  </button>
  <button class="ibtn tool" data-tool="laser" data-i18n-label="laser" data-i18n-title="laser" data-keys="L" aria-pressed="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
  </button>
  <span class="sep"></span>
  <div id="swatches" role="radiogroup"></div>
  <button class="swatch custom" id="btn-custom" data-i18n-label="customColor" data-i18n-title="customColor" aria-haspopup="dialog"></button>
</nav>

<!-- Text formatting bar (floats above the text being edited) -->
<div class="glass" id="text-bar" role="toolbar">
  <button class="tbtn" id="tb-font" aria-haspopup="menu" data-i18n-label="font">Sans</button>
  <span class="sep"></span>
  <button class="ibtn" id="tb-smaller" data-i18n-label="smaller"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <output id="tb-size">24</output>
  <button class="ibtn" id="tb-bigger" data-i18n-label="larger"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
  <span class="sep"></span>
  <button class="swatch" id="tb-color" data-i18n-label="textColor" aria-haspopup="dialog"></button>
</div>
<div class="glass menu" id="font-menu" role="menu"></div>

<!-- Selection bar -->
<div class="glass" id="sel-bar" role="status">
  <span id="sel-count"></span>
  <button class="sel-btn" id="sel-duplicate" data-i18n-label="duplicate" data-i18n-title="duplicate">
    <svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16H8"/></svg>
    <span data-i18n="duplicate"></span>
  </button>
  <button class="sel-btn" id="sel-sticker" data-i18n-label="saveSticker" data-i18n-title="saveSticker">
    <svg viewBox="0 0 24 24"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9.5L21 14.5V5a2 2 0 0 0-2-2z"/><path d="M14.5 21v-4.5a2 2 0 0 1 2-2H21"/></svg>
    <span data-i18n="saveSticker"></span>
  </button>
  <button class="sel-btn" id="sel-ai" data-i18n-label="aiActions" data-i18n-title="aiActions" aria-haspopup="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
    <span data-i18n="aiShort"></span>
  </button>
  <button id="sel-delete" data-i18n="delete"></button>
</div>
<div class="glass menu" id="ai-menu" role="menu">
  <button class="mi" role="menuitem" data-ai="tidy"><span data-i18n="aiTidy"></span></button>
  <button class="mi" role="menuitem" data-ai="solve"><span data-i18n="aiSolve"></span></button>
  <button class="mi" role="menuitem" data-ai="plot"><span data-i18n="aiPlot"></span></button>
  <hr>
  <button class="mi" role="menuitem" data-ai="settings"><span data-i18n="aiSettingsMenu"></span></button>
</div>

<!-- A graph's own controls (floats above it while it is selected or open for exploring) -->
<div class="glass" id="plot-bar" role="toolbar">
  <button class="ibtn" id="pb-out" data-i18n-label="zOut" data-i18n-title="zOut"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <button class="ibtn" id="pb-in" data-i18n-label="zIn" data-i18n-title="zIn"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
  <button class="ibtn" id="pb-home" data-i18n-label="plotHome" data-i18n-title="plotHome"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/></svg></button>
  <span class="sep"></span>
  <button class="tbtn" id="pb-edit" data-i18n="plotEdit" aria-expanded="false"></button>
  <button class="tbtn" id="pb-explore" data-i18n="plotExplore"></button>
  <div id="pb-panel" hidden>
    <textarea id="pb-fns" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-label="plotEdit"></textarea>
    <p class="note" data-i18n="plotEditNote"></p>
  </div>
</div>

<!-- Style of the selected objects (floats under the selection) -->
<div class="glass" id="sel-style" role="toolbar">
  <div class="ss-row" id="ss-colors"></div>
  <div class="ss-row ss-line">
    <button class="ibtn" id="ss-thinner" data-i18n-label="thinner"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <output id="ss-width">4</output>
    <button class="ibtn" id="ss-thicker" data-i18n-label="thicker"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
    <span class="sep"></span>
    <div id="ss-dashes" role="radiogroup"></div>
  </div>
</div>

<!-- Other readings of the character that was just converted from handwriting -->
<div class="glass" id="ink-alts" role="toolbar"></div>

<!-- Popovers -->
<div class="glass menu" id="dash-menu" role="menu">
  <button class="mi dash-mi" role="menuitemradio" data-dash="solid"><svg viewBox="0 0 48 12"><path d="M5 6h38"/></svg><span data-i18n="dash_solid"></span></button>
  <button class="mi dash-mi" role="menuitemradio" data-dash="dotted"><svg viewBox="0 0 48 12"><path d="M5 6h38" stroke-dasharray="0 5"/></svg><span data-i18n="dash_dotted"></span></button>
  <button class="mi dash-mi" role="menuitemradio" data-dash="dashed"><svg viewBox="0 0 48 12"><path d="M5 6h38" stroke-dasharray="6 5"/></svg><span data-i18n="dash_dashed"></span></button>
  <button class="mi dash-mi" role="menuitemradio" data-dash="long"><svg viewBox="0 0 48 12"><path d="M5 6h38" stroke-dasharray="13 6"/></svg><span data-i18n="dash_long"></span></button>
  <button class="mi dash-mi" role="menuitemradio" data-dash="dashdot"><svg viewBox="0 0 48 12"><path d="M5 6h38" stroke-dasharray="10 5 0 5"/></svg><span data-i18n="dash_dashdot"></span></button>
</div>
<div class="glass menu" id="menu" role="menu">
  <button class="mi" role="menuitem" data-act="new"><span data-i18n="mNew"></span></button>
  <button class="mi" role="menuitem" data-act="sheet"><span data-i18n="mNewSheet"></span></button>
  <hr>
  <button class="mi" role="menuitem" data-act="gallery"><span data-i18n="mGallery"></span><kbd>Ctrl G</kbd></button>
  <button class="mi" role="menuitem" data-act="save-file" id="mi-save-file" hidden><span></span><kbd>Ctrl S</kbd></button>
  <button class="mi" role="menuitem" data-act="save-gallery" id="mi-save-gallery"><span data-i18n="mSaveGallery"></span><kbd>Ctrl S</kbd></button>
  <button class="mi" role="menuitem" data-act="save-to"><span data-i18n="mSaveTo"></span><kbd>Ctrl ⇧ S</kbd></button>
  <button class="mi" role="menuitem" data-act="open"><span data-i18n="mOpenFrom"></span><kbd>Ctrl O</kbd></button>
  <hr>
  <button class="mi" role="menuitem" data-act="stickers"><span data-i18n="mStickersMenu"></span></button>
  <hr>
  <button class="mi" role="menuitem" data-act="export"><span data-i18n="mExport"></span><kbd>Ctrl E</kbd></button>
  <button class="mi" role="menuitem" data-act="import"><span data-i18n="mImport"></span></button>
  <button class="mi" role="menuitem" data-act="share"><span data-i18n="mShare"></span></button>
  <button class="mi" role="menuitem" data-act="open-link"><span data-i18n="mOpenLink"></span></button>
  <hr>
  <button class="mi" role="menuitem" data-act="settings"><span data-i18n="mSettings"></span></button>
</div>

<div class="glass menu" id="zoom-menu" role="menu">
  <button class="mi" role="menuitem" data-act="zoom-in"><span data-i18n="zIn"></span><kbd>Ctrl +</kbd></button>
  <button class="mi" role="menuitem" data-act="zoom-out"><span data-i18n="zOut"></span><kbd>Ctrl −</kbd></button>
  <button class="mi" role="menuitem" data-act="zoom-100"><span data-i18n="zActual"></span><kbd>Ctrl 0</kbd></button>
  <button class="mi" role="menuitem" data-act="zoom-fit"><span data-i18n="zFit"></span><kbd>Ctrl 1</kbd></button>
</div>

<div class="glass menu" id="lang-menu" role="menu"></div>
<div class="glass menu" id="ai-model-menu" role="listbox"></div>

<!-- Settings -->
<div class="scrim" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="settings-title" data-i18n="settings"></h2>
      <button class="pill-btn" data-close data-i18n="done"></button>
    </div>

    <h3 data-i18n="appearance"></h3>
    <div class="group">
      <div class="row col">
        <span id="lbl-theme" data-i18n="theme"></span>
        <div class="seg" data-seg="theme" role="radiogroup" aria-labelledby="lbl-theme">
          <button role="radio" data-value="light" data-i18n="light"></button>
          <button role="radio" data-value="dark" data-i18n="dark"></button>
          <button role="radio" data-value="system" data-i18n="system"></button>
        </div>
      </div>
      <div class="row col">
        <span id="lbl-canvas" data-i18n="canvasColor"></span>
        <div class="seg" data-seg="canvas" role="radiogroup" aria-labelledby="lbl-canvas">
          <button role="radio" data-value="dark" data-i18n="dark"></button>
          <button role="radio" data-value="light" data-i18n="light"></button>
          <button role="radio" data-value="theme" data-i18n="theme"></button>
          <button role="radio" data-value="custom" data-i18n="custom"></button>
        </div>
        <div class="color-row" id="canvas-custom" hidden>
          <span id="lbl-cc" data-i18n="customColor"></span>
          <button class="color-well" id="canvas-color" aria-labelledby="lbl-cc" aria-haspopup="dialog"></button>
        </div>
      </div>
    </div>

    <h3 id="lang-title"></h3>
    <div class="group">
      <div class="row">
        <span id="lbl-lang"></span>
        <button class="pill-btn quiet" id="lang-btn" aria-haspopup="menu" aria-labelledby="lbl-lang lang-btn"></button>
      </div>
    </div>

    <h3 data-i18n="drawing"></h3>
    <div class="group">
      <div class="row col">
        <div class="row-top"><label for="smoothing" data-i18n="smoothing"></label><output id="smoothing-out"></output></div>
        <input type="range" id="smoothing" min="0" max="100" step="any" value="0">
        <p class="note" data-i18n="smoothingNote"></p>
      </div>
      <div class="row">
        <div><span id="lbl-snap" data-i18n="snap"></span><p class="note" data-i18n="snapNote"></p></div>
        <button class="switch" role="switch" data-switch="snap" aria-labelledby="lbl-snap"></button>
      </div>
      <div class="row">
        <div><label for="snap-delay" data-i18n="snapDelay"></label><p class="note" data-i18n="snapDelayNote"></p></div>
        <span class="num"><input type="number" id="snap-delay" min="0.2" max="10" step="0.1" value="1" inputmode="decimal"><i>s</i></span>
      </div>
      <div class="row">
        <div><span id="lbl-finger" data-i18n="finger"></span><p class="note" data-i18n="fingerNote"></p></div>
        <button class="switch" role="switch" data-switch="fingerDraw" aria-labelledby="lbl-finger"></button>
      </div>
      <div class="row">
        <div><span id="lbl-pressure" data-i18n="pressure"></span><p class="note" data-i18n="pressureNote"></p></div>
        <button class="switch" role="switch" data-switch="pressure" aria-labelledby="lbl-pressure"></button>
      </div>
      <div class="row">
        <div><span id="lbl-scratch" data-i18n="scratch"></span><p class="note" data-i18n="scratchNote"></p></div>
        <button class="switch" role="switch" data-switch="scratch" aria-labelledby="lbl-scratch"></button>
      </div>
      <div class="row" id="files-copy-row" hidden>
        <div><span id="lbl-files-copy" data-i18n="filesCopy"></span><p class="note" data-i18n="filesCopyNote"></p></div>
        <button class="switch" role="switch" data-switch="filesCopy" aria-labelledby="lbl-files-copy"></button>
      </div>
    </div>

    <h3 data-i18n="handwriting"></h3>
    <div class="group">
      <div class="row">
        <div><span id="lbl-ink" data-i18n="ink"></span><p class="note" data-i18n="inkNote"></p></div>
        <button class="switch" role="switch" data-switch="ink" aria-labelledby="lbl-ink"></button>
      </div>
      <div class="row">
        <div><label for="ink-delay" data-i18n="inkDelay"></label><p class="note" data-i18n="inkDelayNote"></p></div>
        <span class="num"><input type="number" id="ink-delay" min="0.2" max="10" step="0.1" value="1" inputmode="decimal"><i>s</i></span>
      </div>
      <div class="row col">
        <span id="lbl-alpha" data-i18n="alphabet"></span>
        <div class="seg" data-seg="inkScript" role="radiogroup" aria-labelledby="lbl-alpha">
          <button role="radio" data-value="latin" data-i18n="latin"></button>
          <button role="radio" data-value="cyrillic" data-i18n="cyrillic"></button>
        </div>
      </div>
    </div>

    <h3 id="ai-title" data-i18n="aiTitle"></h3>
    <div class="group" id="ai-group">
      <div class="row col">
        <span id="lbl-ai-provider" data-i18n="aiProvider"></span>
        <div class="seg" id="ai-provider" role="radiogroup" aria-labelledby="lbl-ai-provider">
          <button role="radio" data-value="gemini">Gemini</button>
          <button role="radio" data-value="openai">OpenAI</button>
          <button role="radio" data-value="anthropic">Claude</button>
          <button role="radio" data-value="custom" data-i18n="aiOther"></button>
        </div>
      </div>
      <div class="row col" id="ai-base-row" hidden>
        <label for="ai-base" data-i18n="aiBaseUrl"></label>
        <input class="field" id="ai-base" type="url" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="https://openrouter.ai/api/v1">
      </div>
      <div class="row col">
        <div class="row-top"><label for="ai-key" data-i18n="aiKey"></label><a id="ai-key-link" target="_blank" rel="noopener" data-i18n="aiGetKey"></a></div>
        <input class="field" id="ai-key" type="password" spellcheck="false" autocomplete="off" autocapitalize="off" data-lpignore="true">
      </div>
      <div class="row col">
        <div class="row-top"><label for="ai-model" data-i18n="aiModel"></label><button class="pill-btn quiet" id="ai-list" data-i18n="aiListModels"></button></div>
        <input class="field" id="ai-model" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" role="combobox" aria-autocomplete="list" aria-controls="ai-model-menu" aria-expanded="false">
      </div>
      <p class="note" data-i18n="aiPrivacy"></p>
      <p class="note" data-i18n="aiCost"></p>
      <div class="row"><span></span><button class="pill-btn quiet" id="ai-forget" data-i18n="aiForget"></button></div>
    </div>

    <h3 data-i18n="canvas"></h3>
    <div class="group">
      <div class="seg" data-seg="grid" role="radiogroup">
        <button role="radio" data-value="none" data-i18n="plain"></button>
        <button role="radio" data-value="dots" data-i18n="dots"></button>
        <button role="radio" data-value="ruled" data-i18n="lined"></button>
        <button role="radio" data-value="lines" data-i18n="grid"></button>
      </div>
    </div>

    <!-- Credits and version. VERSION RULE (see CLAUDE.md): YYYY.MM.DD.NN, NN = that day's release count. -->
    <footer class="credits">
      <p>Nemes Dániel © 2026-now</p>
      <p id="app-version">version: 2026.11.16.01.</p>
      <p class="credit-links"><a href="https://citromoseper.github.io/Whiteboard-site/" target="_blank" rel="noopener" data-i18n="website">Website</a> · <a href="https://github.com/CITROMOSEPER/Whiteboard" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </div>
</div>

<!-- Gallery -->
<div class="scrim" id="gallery" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
  <div class="sheet wide">
    <div class="sheet-head">
      <div class="g-title">
        <button class="ibtn" id="g-back" aria-label="Back" disabled><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <h2 id="gallery-title" data-i18n="mGallery"></h2>
      </div>
      <div class="g-head-actions">
        <button class="pill-btn quiet" id="g-new-board" data-i18n="mNew"></button>
        <button class="pill-btn quiet" id="g-new" data-i18n="gNewFolder"></button>
        <button class="pill-btn" data-close data-i18n="done"></button>
      </div>
    </div>
    <nav id="g-crumbs"></nav>
    <div id="g-msg" hidden></div>
    <div id="g-grid"></div>
    <div id="g-bar" hidden></div>
    <div id="g-foot"></div>
  </div>
</div>
<div class="glass menu" id="g-menu" role="menu"></div>
<div class="glass" id="g-ghost" aria-hidden="true"></div>

<!-- Export -->
<div class="scrim" id="export" role="dialog" aria-modal="true" aria-labelledby="export-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="export-title" data-i18n="export"></h2>
      <button class="pill-btn quiet" data-close data-i18n="cancel"></button>
    </div>

    <h3 data-i18n="format"></h3>
    <div class="group">
      <div class="seg" data-seg="format" role="radiogroup">
        <button role="radio" data-value="png">PNG</button>
        <button role="radio" data-value="jpeg">JPEG</button>
        <button role="radio" data-value="webp">WebP</button>
        <button role="radio" data-value="bmp">BMP</button>
        <button role="radio" data-value="svg">SVG</button>
        <button role="radio" data-value="pdf">PDF</button>
      </div>
      <p class="note" id="format-note"></p>
    </div>

    <div id="scale-block">
      <h3 data-i18n="resolution"></h3>
      <div class="group">
        <div class="seg" data-seg="scale" role="radiogroup">
          <button role="radio" data-value="1">1×</button>
          <button role="radio" data-value="2">2×</button>
          <button role="radio" data-value="4">4×</button>
        </div>
      </div>
    </div>

    <h3 data-i18n="background"></h3>
    <div class="group">
      <div class="seg" data-seg="bg" role="radiogroup">
        <button role="radio" data-value="theme" data-i18n="board"></button>
        <button role="radio" data-value="white" data-i18n="white"></button>
        <button role="radio" data-value="none" data-i18n="transparent"></button>
      </div>
    </div>

    <div id="exp-pattern-block">
      <h3 data-i18n="exportPattern"></h3>
      <div class="group">
        <div class="row">
          <p class="note" id="lbl-exp-pattern" data-i18n="exportPatternNote"></p>
          <button class="switch" role="switch" id="exp-pattern" aria-labelledby="lbl-exp-pattern" aria-checked="false"></button>
        </div>
      </div>
    </div>

    <button class="primary" id="btn-export" data-i18n="export"></button>
  </div>
</div>

<!-- New sheet: a board of a fixed paper size -->
<div class="scrim" id="sheets" role="dialog" aria-modal="true" aria-labelledby="sheets-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="sheets-title" data-i18n="sheetTitle"></h2>
      <button class="pill-btn quiet" data-close data-i18n="cancel"></button>
    </div>
    <p class="note" data-i18n="sheetNote"></p>
    <h3 data-i18n="orientation"></h3>
    <div class="group">
      <div class="seg" data-seg="orient" role="radiogroup">
        <button role="radio" data-value="portrait" data-i18n="portrait"></button>
        <button role="radio" data-value="landscape" data-i18n="landscape"></button>
      </div>
    </div>
    <div id="sz-list"></div>
  </div>
</div>

<!-- Share link -->
<div class="scrim" id="share" role="dialog" aria-modal="true" aria-labelledby="share-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="share-title" data-i18n="shareTitle"></h2>
      <button class="pill-btn" data-close data-i18n="done"></button>
    </div>
    <p class="note" data-i18n="shareNote"></p>
    <h3 data-i18n="shareLinkLabel"></h3>
    <div class="group">
      <input id="share-link" type="text" readonly spellcheck="false" autocomplete="off" data-i18n-label="shareLinkLabel">
      <p class="note" id="share-stats"></p>
    </div>
    <ul id="share-warn" hidden></ul>
    <div class="share-actions">
      <button class="primary" id="share-copy" data-i18n="shareCopy"></button>
      <button class="primary quiet" id="share-send" data-i18n="shareSend" hidden></button>
    </div>
  </div>
</div>

<!-- Open share link: paste a link (for the installed app, which has no address bar) -->
<div class="scrim" id="open-link" role="dialog" aria-modal="true" aria-labelledby="open-link-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="open-link-title" data-i18n="openLinkTitle"></h2>
      <button class="pill-btn quiet" data-close data-i18n="cancel"></button>
    </div>
    <p class="note" data-i18n="openLinkNote"></p>
    <h3 data-i18n="shareLinkLabel"></h3>
    <div class="group">
      <input id="open-link-input" type="url" spellcheck="false" autocomplete="off" autocapitalize="off" inputmode="url" data-i18n-label="shareLinkLabel" placeholder="https://…/#b=…">
    </div>
    <button class="primary" id="open-link-go" data-i18n="openLinkGo"></button>
  </div>
</div>

<!-- A question before something that replaces the board -->
<div class="scrim" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-text">
  <div class="sheet">
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="pill-btn quiet" data-close data-i18n="cancel"></button>
      <button class="pill-btn" id="confirm-ok"></button>
    </div>
  </div>
</div>

<div class="glass" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="toast-action" hidden></button></div>
<div id="drop-blob" aria-hidden="true"><i></i></div>
<input type="file" id="file-input" accept=".whtbd,.WHTBD,.json,application/json,.pdf,application/pdf" hidden>
<input type="file" id="addboards-input" accept=".whtbd,.WHTBD,.json,application/json" multiple hidden>
<input type="file" id="restore-input" accept=".wbgallery,.wbstickers,.json,application/json" hidden>
<input type="file" id="import-input" accept="image/png,image/jpeg,image/webp,image/bmp,image/svg+xml,application/pdf,.png,.jpg,.jpeg,.webp,.bmp,.svg,.pdf" hidden>

<script src="js/i18n.js"></script>
<script src="js/geometry.js"></script>
<script src="js/mathexpr.js"></script>
<script src="js/mathtype.js"></script>
<script src="js/plot.js"></script>
<script src="js/ai.js"></script>
<script src="js/io.js"></script>
<script src="js/fill.js"></script>
<script src="js/picker.js"></script>
<script src="js/ink-model.js"></script>
<script src="js/ink.js"></script>
<script src="js/gallery.js"></script>
<script src="js/share.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>
