<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Whiteboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
  // Resolve the theme before first paint so there is no light/dark flash.
  (function () {
    var s = {}, t;
    try { s = JSON.parse(localStorage.getItem('wb.settings')) || {}; } catch (e) {}
    t = s.theme || 'system';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var c = s.canvas === 'light' ? '#ffffff' : s.canvas === 'dark' ? '#1c1c1e' : s.canvas === 'custom' ? s.canvasCustom : '';
    if (c) document.documentElement.style.setProperty('--canvas', c);
  })();
</script>
</head>
<body>

<main id="board" data-grid="dots">
  <canvas id="canvas" aria-label="Whiteboard canvas"></canvas>
  <textarea id="text-edit" rows="1" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-label="text"></textarea>
  <div id="brush-cursor" aria-hidden="true"></div>
  <p id="hint" class="gone"><span data-i18n="hint1"></span><br><span data-i18n="hint2"></span><br><span data-i18n="hint3"></span></p>
</main>

<!-- Top left: file -->
<header class="glass bar" id="bar-file">
  <button class="ibtn" id="btn-menu" data-i18n-label="menu" aria-haspopup="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <input id="doc-title" type="text" value="" data-i18n-label="boardName" spellcheck="false" autocomplete="off" maxlength="80">
</header>

<!-- Top right: history + zoom -->
<div class="glass bar" id="bar-view">
  <button class="ibtn" id="btn-undo" data-i18n-label="undo" data-i18n-title="undo" data-keys="Ctrl+Z" disabled>
    <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <button class="ibtn" id="btn-redo" data-i18n-label="redo" data-i18n-title="redo" data-keys="Ctrl+Shift+Z" disabled>
    <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
  </button>
  <span class="sep"></span>
  <button class="tbtn" id="btn-zoom" data-i18n-label="zoom" aria-haspopup="menu" aria-expanded="false">100%</button>
</div>

<!-- Left: size + opacity -->
<aside class="glass" id="side">
  <div class="vslider" id="sl-size" role="slider" tabindex="0" data-i18n-label="thickness" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
    <div class="vslider-fill"></div>
    <svg class="vslider-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/></svg>
  </div>
  <div class="vslider" id="sl-opacity" role="slider" tabindex="0" data-i18n-label="opacity" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100">
    <div class="vslider-fill"></div>
    <svg class="vslider-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 0 1 0 14z" fill="currentColor" stroke="none"/></svg>
  </div>
</aside>
<div class="glass" id="preview" aria-hidden="true">
  <div id="preview-stage"><div id="preview-dot"></div></div>
  <div id="preview-label">4 px</div>
</div>

<!-- Bottom: tools + colours -->
<nav class="glass" id="dock">
  <button class="ibtn tool" data-tool="pen" data-i18n-label="pen" data-i18n-title="pen" data-keys="P" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
  </button>
  <button class="ibtn tool" data-tool="eraser" data-i18n-label="eraser" data-i18n-title="eraser" data-keys="E" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
  </button>
  <button class="ibtn tool" data-tool="text" data-i18n-label="text" data-i18n-title="text" data-keys="T" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
  </button>
  <button class="ibtn tool" data-tool="select" data-i18n-label="select" data-i18n-title="select" data-keys="V" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M3 11 22 2l-9 19-2-8-8-2z"/></svg>
  </button>
  <button class="ibtn tool" data-tool="hand" data-i18n-label="move" data-i18n-title="move" data-keys="H / Space" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
  </button>
  <span class="sep"></span>
  <div id="swatches" role="radiogroup"></div>
  <button class="swatch custom" id="btn-custom" data-i18n-label="customColor" data-i18n-title="customColor" aria-haspopup="dialog"></button>
</nav>

<!-- Text formatting bar (floats above the text being edited) -->
<div class="glass" id="text-bar" role="toolbar">
  <button class="tbtn" id="tb-font" aria-haspopup="menu" data-i18n-label="font">Sans</button>
  <span class="sep"></span>
  <button class="ibtn" id="tb-smaller" data-i18n-label="smaller"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <output id="tb-size">24</output>
  <button class="ibtn" id="tb-bigger" data-i18n-label="larger"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
  <span class="sep"></span>
  <button class="swatch" id="tb-color" data-i18n-label="textColor" aria-haspopup="dialog"></button>
</div>
<div class="glass menu" id="font-menu" role="menu"></div>

<!-- Selection bar -->
<div class="glass" id="sel-bar" role="status">
  <span id="sel-count"></span>
  <button id="sel-delete" data-i18n="delete"></button>
</div>

<!-- Other readings of the character that was just converted from handwriting -->
<div class="glass" id="ink-alts" role="toolbar"></div>

<!-- Popovers -->
<div class="glass menu" id="menu" role="menu">
  <button class="mi" role="menuitem" data-act="new"><span data-i18n="mNew"></span></button>
  <hr>
  <button class="mi" role="menuitem" data-act="gallery"><span data-i18n="mGallery"></span><kbd>Ctrl G</kbd></button>
  <button class="mi" role="menuitem" data-act="save-file" id="mi-save-file" hidden><span></span><kbd>Ctrl S</kbd></button>
  <button class="mi" role="menuitem" data-act="save-gallery" id="mi-save-gallery"><span data-i18n="mSaveGallery"></span><kbd>Ctrl S</kbd></button>
  <button class="mi" role="menuitem" data-act="save-to"><span data-i18n="mSaveTo"></span><kbd>Ctrl ⇧ S</kbd></button>
  <button class="mi" role="menuitem" data-act="open"><span data-i18n="mOpenFrom"></span><kbd>Ctrl O</kbd></button>
  <hr>
  <button class="mi" role="menuitem" data-act="export"><span data-i18n="mExport"></span><kbd>Ctrl E</kbd></button>
  <button class="mi" role="menuitem" data-act="import"><span data-i18n="mImport"></span></button>
  <hr>
  <button class="mi" role="menuitem" data-act="clear"><span data-i18n="mClear"></span></button>
  <hr>
  <button class="mi" role="menuitem" data-act="settings"><span data-i18n="mSettings"></span></button>
</div>

<div class="glass menu" id="zoom-menu" role="menu">
  <button class="mi" role="menuitem" data-act="zoom-in"><span data-i18n="zIn"></span><kbd>Ctrl +</kbd></button>
  <button class="mi" role="menuitem" data-act="zoom-out"><span data-i18n="zOut"></span><kbd>Ctrl −</kbd></button>
  <button class="mi" role="menuitem" data-act="zoom-100"><span data-i18n="zActual"></span><kbd>Ctrl 0</kbd></button>
  <button class="mi" role="menuitem" data-act="zoom-fit"><span data-i18n="zFit"></span><kbd>Ctrl 1</kbd></button>
</div>

<div class="glass menu" id="lang-menu" role="menu"></div>

<!-- Settings -->
<div class="scrim" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="settings-title" data-i18n="settings"></h2>
      <button class="pill-btn" data-close data-i18n="done"></button>
    </div>

    <h3 data-i18n="appearance"></h3>
    <div class="group">
      <div class="row col">
        <span id="lbl-theme" data-i18n="theme"></span>
        <div class="seg" data-seg="theme" role="radiogroup" aria-labelledby="lbl-theme">
          <button role="radio" data-value="light" data-i18n="light"></button>
          <button role="radio" data-value="dark" data-i18n="dark"></button>
          <button role="radio" data-value="system" data-i18n="system"></button>
        </div>
      </div>
      <div class="row col">
        <span id="lbl-canvas" data-i18n="canvasColor"></span>
        <div class="seg" data-seg="canvas" role="radiogroup" aria-labelledby="lbl-canvas">
          <button role="radio" data-value="dark" data-i18n="dark"></button>
          <button role="radio" data-value="light" data-i18n="light"></button>
          <button role="radio" data-value="theme" data-i18n="theme"></button>
          <button role="radio" data-value="custom" data-i18n="custom"></button>
        </div>
        <div class="color-row" id="canvas-custom" hidden>
          <span id="lbl-cc" data-i18n="customColor"></span>
          <button class="color-well" id="canvas-color" aria-labelledby="lbl-cc" aria-haspopup="dialog"></button>
        </div>
      </div>
    </div>

    <h3 id="lang-title"></h3>
    <div class="group">
      <div class="row">
        <span id="lbl-lang"></span>
        <button class="pill-btn quiet" id="lang-btn" aria-haspopup="menu" aria-labelledby="lbl-lang lang-btn"></button>
      </div>
    </div>

    <h3 data-i18n="drawing"></h3>
    <div class="group">
      <div class="row col">
        <div class="row-top"><label for="smoothing" data-i18n="smoothing"></label><output id="smoothing-out"></output></div>
        <input type="range" id="smoothing" min="0" max="100" step="any" value="0">
        <p class="note" data-i18n="smoothingNote"></p>
      </div>
      <div class="row">
        <div><span id="lbl-snap" data-i18n="snap"></span><p class="note" data-i18n="snapNote"></p></div>
        <button class="switch" role="switch" data-switch="snap" aria-labelledby="lbl-snap"></button>
      </div>
      <div class="row">
        <div><label for="snap-delay" data-i18n="snapDelay"></label><p class="note" data-i18n="snapDelayNote"></p></div>
        <span class="num"><input type="number" id="snap-delay" min="0.2" max="10" step="0.1" value="1" inputmode="decimal"><i>s</i></span>
      </div>
      <div class="row">
        <div><span id="lbl-finger" data-i18n="finger"></span><p class="note" data-i18n="fingerNote"></p></div>
        <button class="switch" role="switch" data-switch="fingerDraw" aria-labelledby="lbl-finger"></button>
      </div>
    </div>

    <h3 data-i18n="handwriting"></h3>
    <div class="group">
      <div class="row">
        <div><span id="lbl-ink" data-i18n="ink"></span><p class="note" data-i18n="inkNote"></p></div>
        <button class="switch" role="switch" data-switch="ink" aria-labelledby="lbl-ink"></button>
      </div>
      <div class="row">
        <div><label for="ink-delay" data-i18n="inkDelay"></label><p class="note" data-i18n="inkDelayNote"></p></div>
        <span class="num"><input type="number" id="ink-delay" min="0.2" max="10" step="0.1" value="1" inputmode="decimal"><i>s</i></span>
      </div>
      <div class="row col">
        <span id="lbl-alpha" data-i18n="alphabet"></span>
        <div class="seg" data-seg="inkScript" role="radiogroup" aria-labelledby="lbl-alpha">
          <button role="radio" data-value="latin" data-i18n="latin"></button>
          <button role="radio" data-value="cyrillic" data-i18n="cyrillic"></button>
        </div>
      </div>
    </div>

    <h3 data-i18n="canvas"></h3>
    <div class="group">
      <div class="seg" data-seg="grid" role="radiogroup">
        <button role="radio" data-value="none" data-i18n="plain"></button>
        <button role="radio" data-value="dots" data-i18n="dots"></button>
        <button role="radio" data-value="lines" data-i18n="grid"></button>
      </div>
    </div>

    <!-- Credits and version. VERSION RULE (see CLAUDE.md): YYYY.MM.DD.NN, NN = that day's release count. -->
    <footer class="credits">
      <p>Nemes Dániel © 2026-now</p>
      <p id="app-version">version: 2026.11.12.06.</p>
    </footer>
  </div>
</div>

<!-- Gallery -->
<div class="scrim" id="gallery" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
  <div class="sheet wide">
    <div class="sheet-head">
      <div class="g-title">
        <button class="ibtn" id="g-back" aria-label="Back" disabled><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <h2 id="gallery-title" data-i18n="mGallery"></h2>
      </div>
      <div class="g-head-actions">
        <button class="pill-btn quiet" id="g-new-board" data-i18n="mNew"></button>
        <button class="pill-btn quiet" id="g-new" data-i18n="gNewFolder"></button>
        <button class="pill-btn" data-close data-i18n="done"></button>
      </div>
    </div>
    <nav id="g-crumbs"></nav>
    <div id="g-msg" hidden></div>
    <div id="g-grid"></div>
    <div id="g-bar" hidden></div>
    <div id="g-foot"></div>
  </div>
</div>
<div class="glass menu" id="g-menu" role="menu"></div>
<div class="glass" id="g-ghost" aria-hidden="true"></div>

<!-- Export -->
<div class="scrim" id="export" role="dialog" aria-modal="true" aria-labelledby="export-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="export-title" data-i18n="export"></h2>
      <button class="pill-btn quiet" data-close data-i18n="cancel"></button>
    </div>

    <h3 data-i18n="format"></h3>
    <div class="group">
      <div class="seg" data-seg="format" role="radiogroup">
        <button role="radio" data-value="png">PNG</button>
        <button role="radio" data-value="jpeg">JPEG</button>
        <button role="radio" data-value="webp">WebP</button>
        <button role="radio" data-value="bmp">BMP</button>
        <button role="radio" data-value="svg">SVG</button>
        <button role="radio" data-value="pdf">PDF</button>
      </div>
      <p class="note" id="format-note"></p>
    </div>

    <div id="scale-block">
      <h3 data-i18n="resolution"></h3>
      <div class="group">
        <div class="seg" data-seg="scale" role="radiogroup">
          <button role="radio" data-value="1">1×</button>
          <button role="radio" data-value="2">2×</button>
          <button role="radio" data-value="4">4×</button>
        </div>
      </div>
    </div>

    <h3 data-i18n="background"></h3>
    <div class="group">
      <div class="seg" data-seg="bg" role="radiogroup">
        <button role="radio" data-value="theme" data-i18n="board"></button>
        <button role="radio" data-value="white" data-i18n="white"></button>
        <button role="radio" data-value="none" data-i18n="transparent"></button>
      </div>
    </div>

    <button class="primary" id="btn-export" data-i18n="export"></button>
  </div>
</div>

<div class="glass" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="toast-action" hidden></button></div>
<div id="drop-blob" aria-hidden="true"><i></i></div>
<input type="file" id="file-input" accept=".whtbd,.WHTBD,.json,application/json" hidden>
<input type="file" id="restore-input" accept=".wbgallery,.json,application/json" hidden>
<input type="file" id="import-input" accept="image/png,image/jpeg,image/webp,image/bmp,image/svg+xml,application/pdf,.png,.jpg,.jpeg,.webp,.bmp,.svg,.pdf" hidden>

<script src="js/i18n.js"></script>
<script src="js/geometry.js"></script>
<script src="js/io.js"></script>
<script src="js/fill.js"></script>
<script src="js/picker.js"></script>
<script src="js/ink-model.js"></script>
<script src="js/ink.js"></script>
<script src="js/gallery.js"></script>
<script src="js/app.js"></script>
</body>
</html>
